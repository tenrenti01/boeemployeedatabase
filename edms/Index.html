<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOE Employee System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Look: DPWH navy gradients with an orange accent, condensed uppercase headings, rounded cards that lift on hover.
   Taken from the reference deck's style (colors, type, motion), with Bureau of Equipment branding only. */
:root{
  --orange:#FF7A33; --orange-2:#F26522;
  --navy-0:#061E45; --navy-1:#08295F; --navy-2:#0D47A1; --navy-3:#1658C2;
  --grad:linear-gradient(100deg,#061E45 0%,#08295F 40%,#0D47A1 75%,#1658C2 100%);
  --grad-o:linear-gradient(100deg,#D9531A 0%,#F26522 45%,#FF8A47 100%);
  --bg:#EEF2F8; --card:#ffffff; --soft:#F3F5F9; --ink:#1d1d1f; --head:#08295F; --muted:#626a78; --line:#E5E7EC; --line-2:#D3DAE5;
  --on-grad:#ffffff; --on-grad-2:#ffffff;
  color-scheme:light;
  --plantilla:#0D47A1; --plantilla-soft:#E3ECFA; --contract:#D9531A; --contract-soft:#FFEDE3; --people:#1d7a45; --people-soft:#E1F3E8;
  --bad:#B42318; --bad-soft:#FDE8E6; --warn:#8F5400; --warn-soft:#FFF1D6; --hatch:#C3CEDC;
  --dots:rgba(6,30,69,.055); --overlay:rgba(6,30,69,.82);
  --r:16px; --r-sm:10px;
  --shadow:0 12px 32px rgba(6,30,69,.24); --shadow-hi:0 26px 56px rgba(6,30,69,.36);
  --shadow-card:0 8px 22px rgba(6,30,69,.08); --shadow-card-hi:0 18px 38px rgba(6,30,69,.16);
  --ease:cubic-bezier(.22,.61,.36,1); --io:cubic-bezier(.77,0,.18,1);
  --cond:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  /* older names still used inside the page code */
  --sheet:var(--card); --paper:var(--soft); --rule:var(--line); --rule-strong:var(--line-2);
  --accent:var(--navy-2); --accent-soft:var(--plantilla-soft); --accent-ink:#fff;
  --f-display:var(--cond); --f-body:var(--body); --f-mono:var(--body);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg) radial-gradient(var(--dots) 1.3px,transparent 1.6px) 0 0/30px 30px;color:var(--ink);font:15px/1.55 var(--body);letter-spacing:-.006em;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3{font-family:var(--cond);margin:0;line-height:1.02;text-wrap:balance;text-transform:uppercase;color:var(--head)}
h1{font-size:clamp(2.2rem,4.6vw,3.1rem);font-weight:700;letter-spacing:.005em}
h1 em,h2 em{font-style:normal;color:var(--orange)}
h2{font-size:1.6rem;font-weight:700;letter-spacing:.01em}
h3{font-size:1.2rem;font-weight:700;letter-spacing:.04em}
p{margin:0}
a{color:var(--accent)}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.01em}
.muted{color:var(--muted)}
.label{font-family:var(--cond);font-size:.82rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.eyebrow{font-family:var(--cond);font-size:.95rem;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--orange-2)}
.rule{height:4px;width:110px;background:var(--orange);border-radius:3px}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
[hidden]{display:none!important}

/* Top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:2px solid var(--line)}
.topIn{max-width:1640px;margin:0 auto;padding:10px 32px;display:flex;gap:14px;align-items:center;flex-wrap:nowrap;position:relative}
.topIn::after{content:"";position:absolute;left:32px;bottom:-2px;width:144px;height:2px;background:var(--orange)}
.brand{display:flex;align-items:center;gap:12px;margin-right:4px;flex:none;white-space:nowrap}
.seal{width:44px;height:44px;border-radius:12px;background:var(--grad);color:#fff;display:grid;place-items:center;font:700 .95rem var(--cond);letter-spacing:.06em;box-shadow:0 6px 14px rgba(6,30,69,.25);flex:none;transition:transform .4s var(--ease)}
.seal.img{background:none;box-shadow:none;border-radius:0;filter:drop-shadow(0 4px 8px rgba(6,30,69,.25))}
.seal img{width:100%;height:100%;object-fit:contain;display:block}
.brand:hover .seal{transform:scale(1.07)}
.brand b{font:700 1.18rem/1 var(--cond);letter-spacing:.02em;text-transform:uppercase;color:var(--head);display:block}
.brand b em{font-style:normal;color:var(--orange)}
.brand span{font-size:.74rem;color:var(--muted);font-weight:500}
.tabs{display:flex;gap:2px;flex-wrap:nowrap;white-space:nowrap}
.tabs button{position:relative;border:0;background:none;padding:8px 9px;cursor:pointer;font:600 .98rem var(--cond);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);transition:color .3s}
.tabs button::after{content:"";position:absolute;left:9px;right:9px;bottom:2px;height:3px;border-radius:2px;background:var(--orange);transform:scaleX(0);transform-origin:left;transition:transform .45s var(--io)}
.tabs button:hover{color:var(--head)}
.tabs button[aria-current="page"]{color:var(--head)}
.tabs button[aria-current="page"]::after{transform:scaleX(1)}
.grow{flex:1}
.search{min-width:140px;flex:1 1 240px;max-width:340px;position:relative}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted)}
.who{font-size:.8rem;color:var(--muted);text-align:right;line-height:1.25}
.who b{color:var(--head);font-weight:600;display:block}
.sync{position:fixed;left:16px;bottom:16px;z-index:55;display:inline-flex;align-items:center;gap:8px;font:600 .82rem var(--cond);letter-spacing:.12em;text-transform:uppercase;padding:8px 14px;border-radius:999px;background:var(--card);color:var(--head);border:1px solid var(--line);box-shadow:var(--shadow-card-hi);white-space:nowrap;animation:toastIn2 .4s var(--ease)}
@keyframes toastIn2{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.sync i{width:11px;height:11px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--orange);animation:spin .9s linear infinite}
.sync.ok{color:var(--people);background:var(--people-soft);border-color:transparent}
.sync.ok{box-shadow:var(--shadow-card)}
.sync.ok i{animation:none;border:0;width:auto;height:auto}
.sync.bad{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.sync.bad i{display:none}

/* Buttons */
.btn{white-space:nowrap;flex:none;position:relative;overflow:hidden;border:1px solid var(--line-2);background:var(--card);color:var(--head);padding:9px 16px;cursor:pointer;font:600 .9rem var(--body);border-radius:var(--r-sm);display:inline-flex;align-items:center;gap:7px;
  transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-color .3s,background-position .7s var(--ease),color .3s}
.btn:hover{transform:translateY(-2px);border-color:var(--orange);box-shadow:var(--shadow-card-hi)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.primary{background:var(--grad);background-size:170% 100%;border-color:transparent;color:#fff;box-shadow:0 8px 20px rgba(6,30,69,.22)}
.btn.primary::before{content:"";position:absolute;left:0;top:0;bottom:0;width:0;background:var(--orange);transition:width .35s var(--ease)}
.btn.primary:hover{background-position:100% 0;box-shadow:0 14px 30px rgba(6,30,69,.32)}
.btn.primary:hover::before{width:5px}
.btn.small{padding:5px 11px;font-size:.82rem;border-radius:8px}
.btn:disabled{opacity:.55;cursor:wait;transform:none;box-shadow:none}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line-2))}
.btn.danger:hover{background:var(--bad-soft);border-color:var(--bad)}
.btn.dangerFill{background:var(--bad);border-color:var(--bad);color:#fff}

main{max-width:1640px;margin:0 auto;padding:28px 32px 80px;display:grid;gap:22px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-card);padding:20px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;min-width:0;align-content:start;transition:box-shadow .4s var(--ease),transform .4s var(--ease)}
.panel:hover{box-shadow:var(--shadow-card-hi)}
.panelHead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:nowrap;border-bottom:1px solid var(--line);padding-bottom:10px}
.panelHead h3{display:flex;align-items:center;gap:10px;white-space:nowrap;flex:none}
.panelHead > .pill,.panelHead > .legend,.panelHead > .btn{flex:none;white-space:nowrap}
.panelHead > .label{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.pgrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:1150px){.pgrid{grid-template-columns:1fr 1fr}.pgrid > :first-child{grid-column:1/-1}}
@media (max-width:900px){.grid3{grid-template-columns:1fr 1fr}.grid3 > .span2{grid-column:1/-1}}
@media (max-width:680px){.grid2,.grid3,.pgrid{grid-template-columns:1fr}}

/* Gradient boxes: lift, shine sweep and an orange edge on hover */
.box{background:var(--grad);background-size:170% 100%;background-position:0 0;color:#fff;border-radius:var(--r);box-shadow:var(--shadow);position:relative;overflow:hidden;
  transition:transform .45s var(--ease),box-shadow .45s var(--ease),background-position .8s var(--ease)}
.box > *{position:relative;z-index:1}
.box::before{content:"";position:absolute;left:0;top:0;bottom:0;width:0;background:var(--orange);transition:width .4s var(--ease);z-index:3}
.box::after{content:"";position:absolute;top:0;bottom:0;left:0;width:45%;z-index:2;pointer-events:none;background:linear-gradient(105deg,transparent 0%,rgba(255,255,255,.13) 50%,transparent 100%);transform:translateX(-200%) skewX(-12deg);transition:transform 1.1s var(--ease)}
.box:hover{transform:translateY(-6px) scale(1.01);box-shadow:var(--shadow-hi);background-position:100% 0}
.box:hover::before{width:7px}
.box:hover::after{transform:translateX(330%) skewX(-12deg)}
.box.org{background:var(--grad-o);background-size:170% 100%;box-shadow:0 12px 32px rgba(242,101,34,.3)}
.box.org::before{background:var(--navy-1)}
.box > .waves{position:absolute;left:0;right:0;bottom:0;height:52%;width:100%;z-index:0;pointer-events:none;opacity:.16}
.waves path{fill:none;stroke:#fff;stroke-width:1.4}
.waves g{animation:drift 26s linear infinite}
.waves g.w2{animation-duration:38s;animation-direction:reverse}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* KPI boxes */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{padding:18px 22px 20px;display:grid;gap:2px;min-width:0}
.kpi .label{color:#fff}
.kpi.org .label{color:#fff}
.kpi .v{font:800 3.3rem/1 var(--cond);letter-spacing:.005em;font-variant-numeric:tabular-nums;margin-top:4px}
.kpi .s{font-size:.88rem;color:#fff}
.kpi.org .s{color:#fff}
.kpi .linkish{color:#fff;text-decoration:underline;text-underline-offset:3px}
@media (max-width:680px){.kpis{grid-template-columns:1fr 1fr}.kpi .v{font-size:2.6rem}}

/* Office bars */
.obar .linkish{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.obar{display:grid;grid-template-columns:minmax(370px,1.2fr) minmax(0,2fr) auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.obar:last-child{border-bottom:0}
.track{display:flex;height:14px;background:var(--soft);min-width:0;border-radius:7px;overflow:hidden}
.track i{display:block;height:100%;transform-origin:left;animation:draw .9s var(--io) backwards .2s}
.track .p{background:linear-gradient(90deg,var(--navy-1),var(--navy-3))} .track .c{background:var(--grad-o)}
.track .v{background:repeating-linear-gradient(135deg,var(--card) 0 3px,var(--hatch) 3px 6px)}
.legend{display:flex;gap:14px;flex-wrap:nowrap;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px;border-radius:3px}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* Lists */
.list{display:grid;grid-template-columns:minmax(0,1fr)}
.li{display:flex;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line);min-width:0;border-radius:8px}
.li:last-child{border-bottom:0}
.li .main{flex:1;min-width:0}
.li .main b{font-weight:600;color:var(--head);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .main span{display:block;font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkish{all:unset;cursor:pointer;color:var(--head)}
.linkish:hover{text-decoration:underline}
.linkish.li{display:flex;gap:10px;align-items:center;width:100%;box-sizing:border-box;padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;border-radius:8px;transition:transform .35s var(--ease),background .3s}
.linkish.li:last-child{border-bottom:0}
.linkish.li:hover{text-decoration:none;background:var(--soft);transform:translateX(6px)}
.linkish.li:hover b{color:var(--orange-2)}
.empty{color:var(--muted);font-size:.9rem;padding:8px 0}

/* Pills + tags */
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.plantilla{background:var(--plantilla-soft);color:var(--plantilla)}
.pill.contract{background:var(--contract-soft);color:var(--contract)}
.pill.sep{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.pill.vacant{background:var(--soft);color:var(--muted);border:1px dashed var(--line-2)}
.pill.filled{background:var(--people-soft);color:var(--people)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.saving{background:var(--warn-soft);color:var(--warn)}
.tag{font:600 .8rem var(--cond);letter-spacing:.06em;padding:1px 8px;border:1px solid var(--line);background:var(--soft);color:var(--head);border-radius:6px;white-space:nowrap}

/* Avatars */
.av{width:40px;height:40px;flex:none;border-radius:12px;background:var(--grad);color:#fff;display:grid;place-items:center;font:700 .95rem var(--cond);letter-spacing:.05em;overflow:hidden;box-shadow:0 4px 10px rgba(6,30,69,.16)}
.av img{width:100%;height:100%;object-fit:cover}
.av.big{width:116px;height:116px;font-size:2.5rem;border-radius:20px;box-shadow:0 14px 30px rgba(0,0,0,.28);border:3px solid rgba(255,255,255,.85)}

/* Tables */
.tableWrap{overflow-x:auto;border:1px solid var(--line);background:var(--card);border-radius:var(--r);box-shadow:var(--shadow-card)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
th{font:600 .8rem var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);background:var(--soft);position:sticky;top:0}
tbody tr{transition:background .25s,box-shadow .25s}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--soft);box-shadow:inset 4px 0 0 var(--orange)}
td .who2{display:flex;gap:12px;align-items:center;min-width:220px}
td .who2 b{display:block;font-weight:600;color:var(--head)}
td .who2 span{font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* Toolbar + inputs */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:nowrap;white-space:nowrap}
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 13px;cursor:pointer;font-size:.88rem;font-weight:600;color:var(--muted);border-radius:9px;transition:background .3s,color .3s}
.seg button:hover{color:var(--head)}
.seg button[aria-pressed="true"]{background:var(--grad);color:#fff;box-shadow:0 4px 12px rgba(6,30,69,.25)}
select,input[type=text],input[type=password],input[type=date],input[type=number],input[type=url],textarea{border:1px solid var(--line-2);background:var(--card);padding:8px 11px;border-radius:var(--r-sm);min-width:0;width:100%;transition:border-color .25s,box-shadow .25s}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,122,51,.22)}
.toolbar select,.toolbar input{width:auto}
.search input[type=text]{padding:9px 30px 9px 34px;background:var(--soft);border-radius:12px}
.chipx{display:inline-flex;gap:6px;align-items:center;background:var(--warn-soft);color:var(--warn);padding:3px 10px;font-size:.85rem;font-weight:600;border-radius:999px}
.chipx button{all:unset;cursor:pointer;font-weight:700}
@media (max-width:1380px){.who{display:none}}
@media (max-width:680px){.top{position:static}.who{display:none}.tabs button{padding:6px 8px}.brand{margin-right:0}}

/* Profile hero */
.hero{background:var(--grad);background-size:170% 100%;color:#fff;border:0;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero > *{position:relative;z-index:1}
.hero .waves{position:absolute;left:0;right:0;bottom:0;height:60%;width:100%;z-index:0;opacity:.12;pointer-events:none}
.hero h1{color:#fff;font-weight:800}
.hero h1 .muted{color:#fff!important;font-weight:500}
.hero p{color:var(--on-grad-2)}
.hero p b{color:#fff}
.hero .tag{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.18);color:#fff}
.hero .btn{border-color:rgba(255,255,255,.28)}
.hero .btn.primary{background:var(--grad-o);background-size:170% 100%;box-shadow:0 8px 20px rgba(242,101,34,.35)}
.hero .btn.primary::before{background:var(--navy-0)}
.hero .subtle{color:#fff;text-decoration-color:rgba(255,255,255,.6)}
.hero .subtle:hover{color:#fff}
.hero .rule{margin:4px 0 2px}
.profileHead{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.profileHead .who3{flex:1;min-width:240px;display:grid;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.profileHead .actions{flex-wrap:nowrap}
dl.kv{margin:0;display:grid;grid-template-columns:max-content minmax(0,1fr);gap:7px 16px}
dl.kv dt{white-space:nowrap;color:var(--muted);font:600 .82rem var(--cond);letter-spacing:.1em;text-transform:uppercase;padding-top:2px}
dl.kv dd{margin:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
dl.kv.two{grid-template-columns:max-content minmax(0,1fr) max-content minmax(0,1fr);column-gap:24px}
dl.kv.cols3{grid-template-columns:max-content minmax(0,1fr) max-content minmax(0,1fr) max-content minmax(0,1fr);column-gap:24px;row-gap:12px}
dl.kv.two dd.w,dl.kv.cols3 dd.w{grid-column:span 3}

/* Timeline */
.timeline{display:grid;position:relative}
.ev{display:grid;grid-template-columns:110px 18px minmax(0,1fr);gap:12px;padding:11px 0}
.ev .when{font:600 .9rem var(--cond);letter-spacing:.06em;color:var(--muted);text-align:right;padding-top:1px;text-transform:uppercase}
.ev .dot{position:relative}
.ev .dot::before{content:"";position:absolute;left:8px;top:0;bottom:-22px;width:2px;background:linear-gradient(var(--line-2),var(--line))}
.ev:last-child .dot::before{bottom:auto;height:12px}
.ev .dot::after{content:"";position:absolute;left:2px;top:4px;width:14px;height:14px;border-radius:50%;background:var(--card);border:3px solid var(--line-2);transition:transform .3s var(--ease)}
.ev.now .dot::after{background:var(--orange);border-color:#fff;box-shadow:0 0 0 3px rgba(255,122,51,.35)}
.ev:hover .dot::after{transform:scale(1.2)}
.ev .what{display:grid;gap:3px;min-width:0;transition:transform .35s var(--ease)}
.ev:hover .what{transform:translateX(5px)}
.ev .what b{font-weight:700;font-family:var(--cond);font-size:1.12rem;letter-spacing:.04em;text-transform:uppercase;color:var(--head)}
.ev .what .sub{font-size:.86rem;color:var(--muted)}
@media (max-width:560px){.ev{grid-template-columns:78px 18px minmax(0,1fr)}}

/* Modal: blurred navy backdrop, gradient title bar */
.overlay{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;animation:fadeIn .35s var(--io)}
.modal{background:var(--card);width:min(940px,100%);display:grid;border-radius:var(--r);overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.5);animation:pop .5s var(--ease)}
.modal header{padding:16px 16px 16px 22px;background:var(--grad);color:#fff;display:flex;justify-content:space-between;gap:10px;align-items:center}
.modal header .label{color:#fff}
.modal header h2{color:#fff;display:flex;align-items:center;gap:10px}
.modal header h2::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--orange);flex:none}
.modal .body{padding:20px 22px;display:grid;gap:18px}
.modal footer{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;background:var(--soft)}
.x{all:unset;cursor:pointer;font-size:1.5rem;line-height:1;color:#fff;width:40px;height:40px;display:grid;place-items:center;border-radius:10px;transition:background .25s,transform .25s var(--ease)}
.x:hover{background:var(--orange);transform:scale(1.06)}
@keyframes pop{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
fieldset{border:0;margin:0;padding:0;display:grid;gap:10px}
legend{font:600 .9rem var(--cond);letter-spacing:.2em;text-transform:uppercase;color:var(--orange-2);padding:0;margin-bottom:8px;border-bottom:1px solid var(--line);width:100%;padding-bottom:4px}
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 14px}
.f{display:grid;gap:4px;min-width:0}
.f label{font-size:.82rem;font-weight:600;color:var(--head)}
.f .hint{font-size:.76rem;color:var(--muted)}
.f .err{font-size:.78rem;color:var(--bad);font-weight:600}
.span2{grid-column:span 2} .span4{grid-column:1/-1}
@media (max-width:640px){.fgrid{grid-template-columns:1fr 1fr}.span2{grid-column:1/-1}}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.checks label{font-weight:500;font-size:.9rem;display:flex;gap:6px;align-items:center}
.formErr{background:var(--bad-soft);color:var(--bad);padding:11px 14px;font-weight:600;border-radius:var(--r-sm)}
.current{background:var(--soft);padding:11px 14px;font-size:.9rem;border-radius:var(--r-sm);border-left:4px solid var(--orange)}

/* Toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--grad);color:#fff;padding:12px 18px 12px 24px;font-weight:600;z-index:60;box-shadow:var(--shadow-hi);border-radius:12px;max-width:min(560px,calc(100vw - 32px));overflow:hidden;animation:toastIn .5s var(--ease)}
.toast::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--orange)}
.toast.err{background:linear-gradient(100deg,#6E0F0F,#B42318)}
.toast.err::before{background:#FFB199}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,18px)}to{opacity:1;transform:translate(-50%,0)}}

/* Loading */
.loading{display:grid;place-items:center;align-content:center;min-height:60vh;gap:12px;text-align:center}
.spin{width:46px;height:46px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--orange);animation:spin .9s linear infinite}
.loading .label{letter-spacing:.2em}
@keyframes spin{to{transform:rotate(360deg)}}

/* Entrance: sections rise in one after another when a page opens */
#view.anim > *{animation:rise .7s var(--ease) backwards}
#view.anim > *:nth-child(2){animation-delay:.06s} #view.anim > *:nth-child(3){animation-delay:.12s}
#view.anim > *:nth-child(4){animation-delay:.18s} #view.anim > *:nth-child(5){animation-delay:.24s}
#view.anim > *:nth-child(n+6){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

/* Printed documents (preview) */
#printArea{display:none}
.doc{font-family:Tahoma,Verdana,Geneva,sans-serif;color:#000;background:#fff;padding:24pt 44px 28px;max-width:900px;margin:0 auto}
.doc h1,html.classic .doc h1{font-family:Tahoma,Verdana,Geneva,sans-serif;font-size:12pt;font-weight:bold;text-align:center;letter-spacing:0;text-transform:none;color:#000;margin:0 0 4px}
.doc .agency{text-align:center;font-size:10pt;margin-bottom:2px;color:#000}
.doc table{font-size:.82rem}
.doc th,.doc td{border:1px solid #999;padding:5px 6px;color:#111;white-space:normal}
.doc th{position:static;background:#333;color:#fff;font-size:.78rem}
.doc .meta{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 20px;margin:14px 0;font-size:.9rem}
.doc .sign{display:flex;justify-content:space-between;margin-top:46px;font-size:.85rem}
.doc .sign div{border-top:1px solid #111;padding-top:4px;min-width:220px;text-align:center}
.doc .foot{margin-top:18px;font-size:.75rem;color:#555}
.preview{background:#fff;border:1px solid var(--line-2);max-height:70vh;overflow:auto;border-radius:var(--r-sm)}
@page{size:A4;margin:24pt 72pt 72pt}
@media print{
  body{background:#fff}
  body > *:not(#printArea){display:none!important}
  #printArea{display:block!important}
  .doc{padding:0;max-width:none}
  .coe{padding:0;max-width:none}
}
/* The certificate's own styles live with its code, so the page, the Word file and
   the printed page can never drift apart. They are added to the page at start-up. */
.coeWrap{background:#fff}
.coeWrap .coe{padding:24pt 44px 46px}

/* Search clear, sortable headers, downloads */
.search .clr{all:unset;position:absolute;right:7px;top:50%;transform:translateY(-50%);width:22px;height:22px;display:grid;place-items:center;border-radius:50%;cursor:pointer;color:var(--muted);font-size:1.05rem;line-height:1;transition:background .2s}
.search .clr:hover{background:var(--orange);color:#fff}
th .sortBtn{all:unset;cursor:pointer;display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
th .sortBtn:hover{color:var(--head)}
th .sortBtn .arr{font-size:.62rem;opacity:.45}
th .sortBtn.on{color:var(--head)}
th .sortBtn.on .arr{opacity:1;color:var(--orange)}
th.num .sortBtn{flex-direction:row-reverse}
.dl{display:flex;gap:6px;margin-left:auto}

/* Photo + logo pickers, subtle links */
.avWrap{position:relative;flex:none}
.penBtn{position:absolute;right:-8px;bottom:-8px;width:34px;height:34px;border-radius:50%;border:3px solid #fff;background:var(--grad-o);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 4px 12px rgba(0,0,0,.25);transition:transform .3s var(--ease)}
.penBtn svg{width:14px;height:14px}
.penBtn:hover{transform:scale(1.12) rotate(-8deg)}
.photoPick{display:grid;grid-template-columns:140px minmax(0,1fr);gap:18px}
.photoPrev{width:140px;height:140px;border-radius:18px;background:var(--grad);color:#fff;display:grid;place-items:center;font:700 2.4rem var(--cond);overflow:hidden;box-shadow:var(--shadow-card-hi)}
.photoPrev img{width:100%;height:100%;object-fit:cover}
@media (max-width:520px){.photoPick{grid-template-columns:1fr}}
a.mail{color:inherit;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2);overflow-wrap:anywhere}
a.mail:hover{color:var(--orange-2);text-decoration-color:currentColor}
.moreBtn{justify-self:start}
.filePick{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.filePick .fileName{font-size:.85rem;min-width:0;overflow-wrap:anywhere}
.clipLink{display:inline-flex;gap:4px;align-items:center;font-size:.8rem;color:var(--accent);text-decoration:none;white-space:nowrap}
.clipLink:hover{color:var(--orange-2);text-decoration:underline}
.clipLink svg{width:13px;height:13px}
.orderLink{display:inline-flex;gap:4px;align-items:center;color:var(--orange-2);text-decoration:none;font-weight:600;overflow-wrap:anywhere}
.orderLink:hover{text-decoration:underline}
.orderLink svg{width:12px;height:12px;flex:none}
.licRow{align-items:flex-start}
.licTools{display:flex;align-items:center;gap:6px;flex:none;margin-left:auto}
.pick{position:relative}
.pick > svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);pointer-events:none}
.pickQ{padding-left:34px!important;padding-right:30px!important}
.pickX{all:unset;position:absolute;right:7px;top:50%;transform:translateY(-50%);width:22px;height:22px;display:grid;place-items:center;border-radius:50%;cursor:pointer;color:var(--muted);font-size:1.05rem;line-height:1}
.pickX:hover{background:var(--orange);color:#fff}
.pickList{max-height:320px;overflow-y:auto;width:max(100%,360px)}
.pickList .sgi{white-space:normal}
.pickList .sgi em{font-style:normal;color:var(--muted);font-size:.78rem}
.eduRows{display:grid;gap:8px}
.eduRow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.5fr) 86px 30px;gap:8px;align-items:center}
.eduRow .eduYr{text-align:center}
@media (max-width:780px){.eduRow{grid-template-columns:minmax(0,1fr) 86px 30px}.eduRow .eduDeg{grid-column:1/-1}}
.subtle{all:unset;cursor:pointer;font-size:.8rem;color:var(--muted);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2)}
.subtle:hover{color:var(--head);text-decoration-color:currentColor}
.subtle.danger:hover{color:var(--bad)}
.btnStack{display:grid;gap:4px;justify-items:center}
.brandRow{display:flex;gap:14px;align-items:center}
.logoBox{width:88px;height:88px;border:1px dashed var(--line-2);display:grid;place-items:center;background:var(--soft);overflow:hidden;flex:none;border-radius:14px}
.logoBox img{max-width:100%;max-height:100%}
.note{padding:11px 14px;font-size:.9rem;border-left:4px solid var(--navy-2);background:var(--plantilla-soft);border-radius:var(--r-sm)}
.note.warnNote{border-left-color:var(--orange);background:var(--warn-soft)}
.sepBanner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:rgba(255,255,255,.1);border:1px dashed rgba(255,255,255,.35);font-size:.92rem;border-radius:var(--r-sm)}

/* History entry tools */
.ev .what .head{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.evTools{margin-left:auto;display:flex;gap:2px;opacity:.5;transition:opacity .2s}
.ev:hover .evTools,.evTools:focus-within{opacity:1}
.iconBtn{all:unset;cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border-radius:8px;color:var(--muted);transition:background .2s,color .2s,transform .25s var(--ease)}
.iconBtn svg{width:15px;height:15px}
.iconBtn:hover{background:var(--soft);color:var(--head);transform:scale(1.08)}
.iconBtn.del:hover{color:var(--bad);background:var(--bad-soft)}
@media (hover:none){.evTools{opacity:1}}

/* Heading icons: orange gradient box, white line icon */
.hico{width:30px;height:30px;border-radius:9px;background:var(--grad-o);color:#fff;display:inline-grid;place-items:center;flex:none;box-shadow:0 4px 10px rgba(242,101,34,.32);transition:transform .35s var(--ease)}
.hico svg{width:17px;height:17px}
.panel:hover .hico{transform:rotate(-6deg) scale(1.06)}
/* Dashboard top row: greeting left, number cards right */
.dashTop{display:grid;grid-template-columns:minmax(320px,auto) minmax(0,1fr);gap:28px;align-items:center}
.dashTop .greet{display:grid;gap:8px;align-content:center}
.dashTop .kpi{padding:14px 18px 16px}
.dashTop .kpi .v{font-size:2.7rem}
/* Floating badge while the public test link is on */
.pubBadge{position:fixed;top:78px;right:20px;z-index:30;display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;background:var(--grad-o);color:#fff;font:700 .82rem var(--cond);letter-spacing:.12em;text-transform:uppercase;padding:8px 14px;border-radius:999px;box-shadow:0 10px 24px rgba(242,101,34,.35);animation:toastIn2 .4s var(--ease)}
.pubBadge i{width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 0 0 rgba(255,255,255,.7);animation:pulse 1.8s infinite}
.pubBadge:hover{filter:brightness(1.08);transform:translateY(-1px)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.7)}70%{box-shadow:0 0 0 8px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
/* Search history dropdown */
.sugg{position:absolute;top:calc(100% + 8px);left:0;width:max(100%,340px);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-card-hi);z-index:45;padding:6px;animation:toastIn2 .25s var(--ease)}
.sgh{font:600 .74rem var(--cond);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:8px 10px 4px}
.sgr{display:flex;align-items:center;border-radius:9px}
.sgr:hover,.sgr.on{background:var(--soft)}
.sgi{all:unset;cursor:pointer;flex:1;min-width:0;display:flex;gap:10px;align-items:center;padding:7px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--head);font-weight:500}
.sgi span{overflow:hidden;text-overflow:ellipsis}
.sgi em{font-style:normal;color:var(--muted);font-size:.8rem;margin-left:4px}
.sgi .av{width:26px;height:26px;border-radius:8px;font-size:.72rem}
.sgic{width:26px;height:26px;border-radius:8px;background:var(--soft);color:var(--muted);display:inline-grid;place-items:center;flex:none}
.sgic svg{width:15px;height:15px}
.sgx{all:unset;cursor:pointer;width:26px;height:26px;display:grid;place-items:center;border-radius:7px;color:var(--muted);margin-right:4px}
.sgx:hover{background:var(--bad-soft);color:var(--bad)}
.sgf{border-top:1px solid var(--line);margin-top:4px;padding:8px 10px 4px;text-align:right}
/* Filters, sort levels, PDF columns */
.fchip{background:var(--plantilla-soft);color:var(--plantilla)}
.sortRows{display:grid;gap:10px}
.sortRow{display:grid;grid-template-columns:90px minmax(0,1.4fr) minmax(0,1fr) 34px;gap:10px;align-items:center}
th .sortBtn .arr sub{font-size:.62rem;margin-left:1px}
.colPick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 16px}
.colPick label{display:flex;gap:7px;align-items:center;font-weight:500;font-size:.9rem;padding:6px 8px;border-radius:8px;border:1px solid var(--line);cursor:pointer}
.colPick label:has(input:checked){border-color:var(--orange);background:var(--warn-soft)}
.colPick label.off{opacity:.55;cursor:not-allowed}
/* Headcount collapse caret */
.obarName{display:flex;align-items:center;gap:4px;min-width:0}
.obarName .linkish{min-width:0}
.caret{all:unset;cursor:pointer;width:22px;height:22px;display:grid;place-items:center;border-radius:6px;color:var(--muted);flex:none;transition:transform .3s var(--ease),background .2s,color .2s}
.caret:hover{background:var(--soft);color:var(--head)}
.caret.open{transform:rotate(90deg)}
.caretSp{width:22px;flex:none}
/* Service history: reference preview that slides in beside the timeline */
.svcSplit{display:grid;grid-template-columns:1fr 0fr;gap:0;transition:grid-template-columns .5s var(--io),gap .5s var(--io)}
.svcSplit.open{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px}
.svcLeft{min-width:0}
.svcRight{min-width:0;overflow:hidden;border-radius:14px;border:1px solid var(--line);background:var(--soft);display:flex;flex-direction:column;opacity:0;transform:translateX(14px);transition:opacity .45s var(--io) .08s,transform .45s var(--io) .08s}
.svcSplit.open .svcRight{opacity:1;transform:none}
.svcRightBar{display:flex;align-items:center;gap:10px;padding:9px 10px 9px 14px;background:var(--grad);color:#fff}
.svcRightTitle{font:700 .88rem var(--cond);letter-spacing:.04em;text-transform:uppercase;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.svcRightBar .svcOpenNew{color:#fff;font-size:.78rem;text-decoration:none;opacity:.9;white-space:nowrap}
.svcRightBar .svcOpenNew:hover{opacity:1;text-decoration:underline}
.svcClose{all:unset;cursor:pointer;color:#fff;width:30px;height:30px;display:grid;place-items:center;border-radius:8px;font-size:1.35rem;line-height:1;flex:none;transition:background .2s}
.svcClose:hover{background:rgba(255,255,255,.18)}
.svcViewer{flex:1;min-height:440px;background:var(--sheet);position:relative}
.svcViewer iframe{width:100%;height:100%;min-height:440px;border:0;display:block}
.svcViewer .svcLoad{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:.9rem;padding:20px;text-align:center}
@media (max-width:780px){
  .svcSplit.open{grid-template-columns:1fr;gap:14px}
  .svcViewer,.svcViewer iframe{min-height:62vh}
}
/* Photo crop */
.photoPick{display:grid;grid-template-columns:280px minmax(0,1fr);gap:22px;align-items:start}
.cropBox{position:relative;width:280px;height:280px;border-radius:20px;overflow:hidden;background:var(--soft);box-shadow:var(--shadow-card-hi);display:grid;place-items:center}
.cropBox > img{width:100%;height:100%;object-fit:cover}
.cropBox canvas{width:280px;height:280px;display:block;touch-action:none;cursor:grab}
.cropBox.dragging canvas{cursor:grabbing}
.cropBox.live::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:20px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.9);
  background:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.35)) 33.33% 0/1px 100% no-repeat,linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.35)) 66.66% 0/1px 100% no-repeat,
  linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.35)) 0 33.33%/100% 1px no-repeat,linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.35)) 0 66.66%/100% 1px no-repeat}
.cropEmpty{font:700 3rem var(--cond);color:var(--muted)}
.cropSide{display:grid;gap:14px;align-content:start}
.cropTools{display:grid;gap:12px}
.cropTools input[type=range]{width:100%;accent-color:var(--orange)}
.cropMinis{display:flex;gap:14px;align-items:end}
.cropMinis canvas:first-of-type{width:76px;height:76px;border-radius:14px;box-shadow:var(--shadow-card)}
.cropMinis canvas:last-of-type{width:40px;height:40px;border-radius:12px;box-shadow:var(--shadow-card)}
.newSeat{border:1.5px dashed var(--orange);border-radius:14px;padding:14px 16px;background:color-mix(in srgb,var(--warn-soft) 55%,var(--card));display:grid;gap:12px;animation:toastIn2 .35s var(--ease)}
.nsHead{display:flex;gap:10px;align-items:center}
.nsHead b{display:block;font:700 1.02rem var(--cond);text-transform:uppercase;letter-spacing:.06em;color:var(--head)}
.nsHead span{font-size:.82rem;color:var(--muted)}
/* Calendar picker (from the reference kit, recoloured to the BOE theme) */
.dtIn{cursor:pointer;background:var(--card) no-repeat right 10px center;background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23626a78' stroke-width='2' stroke-linecap='round'%3E%3Crect x='3' y='5' width='18' height='16' rx='2'/%3E%3Cpath d='M8 3v4M16 3v4M3 10h18'/%3E%3C/svg%3E");background-size:16px 16px;padding-right:34px}
.dtIn:hover{border-color:var(--orange)}
.cal{
  --cp:#0D47A1; --ca:#F26522; --cmut:#94a3b8; --cout:#cbd5e1; --cink:#0f172a;
  --cline:#eef1f6; --csoft:#eef3fb; --csoft2:#e3ecf9; --cease:cubic-bezier(.32,.72,0,1); --ch:300px;
  --cfont:"Inter",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --ccond:"Barlow Condensed","Arial Narrow",sans-serif;
  position:fixed; z-index:75; background:#fff; border-radius:14px; padding:14px 16px 12px;
  box-shadow:0 18px 48px rgba(16,32,60,.26),0 2px 6px rgba(16,32,60,.14);
  font-family:var(--cfont); color:var(--cink); width:max-content; max-width:calc(100vw - 16px);
  opacity:0; transform:translateY(-6px) scale(.98); pointer-events:none;
  transition:opacity .18s var(--cease), transform .18s var(--cease);
}
.cal.show{opacity:1; transform:none; pointer-events:auto}
.cal:focus{outline:none}
.cal-head{text-align:center; margin-bottom:11px}
.cal-head small{display:block; font:600 10px var(--ccond); letter-spacing:.16em; text-transform:uppercase; color:var(--cmut); margin-bottom:3px}
.cal-pk{font:700 1.4rem/1.05 var(--ccond); text-transform:uppercase; letter-spacing:.02em; color:var(--cp); white-space:nowrap}
.cal-pk .wd{color:var(--ca)}
.cal-pk.empty{color:var(--cmut); font-size:1.05rem; letter-spacing:.01em}

.cal-steps{display:none; gap:6px; margin-bottom:11px}
.cal-steps button{flex:1; min-width:0; border:0; background:var(--csoft); color:var(--cmut); border-radius:9px; padding:6px 4px 7px; cursor:pointer; text-align:center;
  font:600 8.5px var(--ccond); letter-spacing:.12em; text-transform:uppercase; transition:background-color .16s var(--cease), color .16s var(--cease)}
.cal-steps button .v{display:block; font:700 13px var(--cfont); letter-spacing:0; text-transform:none; margin-top:2px; color:var(--cink)}
.cal-steps button.on{background:var(--cp); color:#cfe0f7}
.cal-steps button.on .v{color:#fff}

.cal-body{display:flex; align-items:stretch; gap:0}
.cal-sect{display:flex; flex-direction:column; gap:9px; padding:0 15px; min-width:0}
.cal-sect:first-child{padding-left:0}
.cal-sect:last-child{padding-right:0}
.cal-sect + .cal-sect{border-left:1px solid var(--cline)}
.cal-sect h4{margin:0; height:12px; font:600 10px/12px var(--ccond); letter-spacing:.16em; text-transform:uppercase; color:var(--cmut); white-space:nowrap}
.cal-box{height:var(--ch)}
.cal-yg{height:100%; display:grid; grid-auto-flow:column; grid-template-rows:repeat(10,1fr); gap:5px 12px}
.cal-mg{height:100%; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(4,1fr); gap:6px}
.cal-dbox{height:var(--ch); display:grid; grid-template-rows:auto 1fr; gap:5px}
.cal-dow{display:grid; grid-template-columns:repeat(7,1fr); gap:3px}
.cal-dow span{text-align:center; font:600 10.5px/1 var(--cfont); letter-spacing:.04em; color:var(--cmut)}
.cal-dg{display:grid; grid-template-columns:repeat(7,1fr); grid-template-rows:repeat(6,1fr); gap:3px}

.cal-y,.cal-m,.cal-d{border:0; background-color:transparent; cursor:pointer; color:var(--cmut); font-family:var(--cfont); font-variant-numeric:tabular-nums;
  transition:background-color .17s var(--cease), color .17s var(--cease), transform .17s var(--cease), box-shadow .17s var(--cease)}
.cal-y{font-size:11.5px; font-weight:400; border-radius:7px; padding:0 12px; min-width:50px; display:grid; place-items:center}
.cal-m{font-size:11.5px; font-weight:400; border-radius:7px; min-width:52px; display:grid; place-items:center}
.cal-d{font-size:12.5px; font-weight:400; border-radius:9px; min-width:30px}
.cal-y:hover,.cal-m:hover,.cal-d:hover{background-color:var(--csoft); color:var(--cp)}
.cal-d:hover{transform:scale(1.08)}
.cal-d.out{color:var(--cout)}
.cal-y[disabled],.cal-m[disabled],.cal-d[disabled]{opacity:.3; cursor:not-allowed; pointer-events:none; color:var(--cmut)}
.cal-d.today{color:var(--ca)}
.cal-y.on,.cal-m.on{background-color:var(--cp); color:#fff; font-weight:700}
.cal-d.on{background-color:var(--ca); color:#fff; font-weight:700; transform:none}
.cal-yhide{visibility:hidden; pointer-events:none}

.cal-foot{display:flex; gap:6px; margin-top:11px; padding-top:10px; border-top:1px solid var(--cline)}
.cal-foot button{flex:1; font:500 11.5px var(--cfont); white-space:nowrap; color:var(--cp); background-color:var(--csoft); border:0; border-radius:8px; padding:7px 4px; cursor:pointer;
  transition:background-color .15s var(--cease), transform .15s var(--cease)}
.cal-foot button:hover{background-color:var(--csoft2); transform:translateY(-1px)}

@media (max-width:560px){
  .cal{width:300px}
  .cal-steps{display:flex}
  .cal-sect{padding:0 !important; border-left:0 !important; display:none}
  .cal-sect h4{display:none}
  .cal-box,.cal-yg{overflow-x:auto}
  .cal.step-year .cal-sect[data-p="year"],
  .cal.step-month .cal-sect[data-p="month"],
  .cal.step-day .cal-sect[data-p="day"]{display:flex}
}
@media (prefers-reduced-motion:reduce){.cal,.cal *{transition-duration:.01ms!important}}
/* Narrower screens: these come last so they win over the desktop rules above */
@media (max-width:1250px){.panelHead h3{white-space:normal;flex:1 1 auto}}
@media (max-width:1100px){
  .dashTop{grid-template-columns:1fr}.pubBadge{top:auto;bottom:16px;right:16px}.colPick{grid-template-columns:repeat(2,minmax(0,1fr))}
  .topIn{flex-wrap:wrap}.toolbar{flex-wrap:wrap}.profileHead .actions{flex-wrap:wrap}
  .obar{grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) auto}
  dl.kv.cols3{grid-template-columns:max-content minmax(0,1fr) max-content minmax(0,1fr)}
  dl.kv.two{grid-template-columns:max-content minmax(0,1fr)} dl.kv.two dd.w{grid-column:auto}
}
@media (max-width:680px){
  .photoPick{grid-template-columns:1fr}.sortRow{grid-template-columns:1fr 1fr}.sortRow .label{grid-column:1/-1}
  dl.kv,dl.kv.two,dl.kv.cols3{grid-template-columns:minmax(0,40%) minmax(0,1fr)} dl.kv.two dd.w,dl.kv.cols3 dd.w{grid-column:auto}
  .panelHead{flex-wrap:wrap}.legend{flex-wrap:wrap}.tabs{flex-wrap:wrap}.search{min-width:0}
  dl.kv dd,dl.kv dt,.li .main b{white-space:normal;overflow:visible;overflow-wrap:anywhere}.toolbar{white-space:normal}.dl{margin-left:0}
  .obar{grid-template-columns:minmax(0,1fr) auto}.obar .track{grid-column:1/-1;grid-row:2}.obar .linkish{white-space:normal}
}

  .brand{gap:9px}
  .brand b{font-size:1rem}
  .brand span{font-size:.66rem}
  .tabs button{font-size:.88rem;padding:5px 7px;letter-spacing:.05em}
  .panel{padding:13px;border-radius:13px;gap:10px}
  .panelHead{padding-bottom:8px;gap:8px}
  .hico{width:25px;height:25px;border-radius:8px}
  .hico svg{width:14px;height:14px}
  .btn{padding:7px 12px;font-size:.85rem}
  .btn.small{padding:4px 9px;font-size:.77rem}
  .kpis{grid-template-columns:1fr 1fr;gap:9px}
  .kpi{padding:12px 13px 13px}
  .kpi .v,.dashTop .kpi .v{font-size:1.85rem}
  .kpi .s{font-size:.78rem}
  .hero,.box{border-radius:13px}
  .li,.linkish.li{padding:8px 5px;gap:8px}
  .li .main span{font-size:.78rem}
  .ev{grid-template-columns:62px 16px minmax(0,1fr);gap:9px;padding:9px 0}
  .ev .when{font-size:.8rem}
  .ev .what b{font-size:1rem}
  .ev .what .sub{font-size:.8rem}
  .ev:hover .what{transform:none}
  .linkish.li:hover{transform:none}
  th,td{padding:7px 9px;font-size:.86rem}
  th{font-size:.72rem;letter-spacing:.1em}
  .tableWrap{border-radius:12px}
  .overlay{padding:0;align-items:stretch}
  .modal{width:100%;border-radius:0;min-height:100%;animation:none}
  .modal header{padding:12px 12px 12px 15px}
  .modal .body{padding:14px 15px;gap:14px}
  .modal footer{padding:11px 15px;position:sticky;bottom:0}
  .modal footer .actions{flex:1;justify-content:flex-end}
  legend{font-size:.84rem;letter-spacing:.16em}
  .fgrid{grid-template-columns:1fr;gap:10px}
  .span2,.span4{grid-column:1/-1}
  .f label{font-size:.8rem}
  .photoPick{grid-template-columns:1fr;gap:14px}
  .cropBox,.cropBox canvas{width:100%;max-width:300px;height:auto;aspect-ratio:1}
  .cropBox{height:auto;aspect-ratio:1;margin:0 auto}
  .colPick{grid-template-columns:1fr}
  .profileHead{gap:14px}
  .profileHead .actions{flex-wrap:wrap}
  .av.big{width:80px;height:80px;font-size:1.8rem;border-radius:16px}
  .doc{padding:14px}
  .preview{max-height:58vh}
  .sync{left:10px;bottom:10px;padding:6px 11px;font-size:.76rem}
  .toast{left:10px;right:10px;bottom:12px;transform:none;max-width:none}
  @keyframes toastIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  #view.anim > *{animation:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* photos */

html.classic td .av{width:26px;height:26px;font-size:10px}
html.classic .av.big{width:84px;height:84px;border-radius:0;box-shadow:none;border:1px solid #A0A0A0;font-size:24px}
html.classic .penBtn{border-radius:0;width:24px;height:24px;right:-4px;bottom:-4px;border:1px solid #8E8F8F;background:linear-gradient(#FDFDFD,#E1E1E1);color:#000;box-shadow:none}
html.classic .penBtn:hover{transform:none;background:linear-gradient(#EAF6FD,#D9F0FC);border-color:#3C7FB1}
html.classic .penBtn svg{width:12px;height:12px}
html.classic .photoPrev{border-radius:0;background:#E9E9E9;color:#000;box-shadow:none;border:1px solid #A0A0A0}
html.classic .cropBox,html.classic .cropMinis canvas{border-radius:0;box-shadow:none}
html.classic .cropBox{border:1px solid #A0A0A0}
html.classic .logoBox{border-radius:0}
/* tables: spreadsheet grid, light-blue hover */
html.classic .tableWrap{border:1px solid #828790;border-radius:0;box-shadow:none}
html.classic #view th{font:12px Tahoma,"Segoe UI",Arial,sans-serif;letter-spacing:0;text-transform:none;color:#000;background:linear-gradient(#FFFFFF,#E9E9E9);border:1px solid #A0A0A0;border-top:0;padding:4px 6px}
html.classic #view td{border:1px solid #D0D0D0;padding:3px 6px}
html.classic #view tbody tr.click:hover{box-shadow:none}
html.classic #view tbody tr.click:hover td{background:#E5F3FB}
html.classic th .sortBtn.on .arr{color:#000}
html.classic td .who2{gap:8px;min-width:200px}
html.classic td .who2 span{font-size:11px;color:#444}
/* toolbars */
html.classic .toolbar{gap:4px}
html.classic .seg{border-radius:0;background:#F0F0F0;border:1px solid #A0A0A0;padding:1px;gap:1px}
html.classic .seg button{border-radius:0;font:12px Tahoma,"Segoe UI",Arial,sans-serif;color:#000;padding:2px 9px}
html.classic .seg button:hover{background:#E5F3FB}
html.classic .seg button[aria-pressed="true"]{background:#CCE8FF;color:#000;box-shadow:inset 0 0 0 1px #3399FF;font-weight:bold}
html.classic .chipx{border-radius:0;border:1px solid #C9C28A;background:#FFFFE1;color:#000;font:12px Tahoma,"Segoe UI",Arial,sans-serif;padding:1px 6px}
html.classic .chipx.fchip{border-color:#3C7FB1;background:#EEF5FC;color:#0B4A8B}
/* employee profile */
html.classic .hero{background:#fff;color:#000;border:1px solid #A0A0A0}
html.classic .hero h1{color:#000}
html.classic .hero h1 .muted{color:#444!important;font-weight:normal}
html.classic .hero p,html.classic .hero p b{color:#000}
html.classic .hero .tag{background:#F0F0F0;border-color:#A0A0A0;color:#000}
html.classic .hero .subtle,html.classic .hero .subtle:hover{color:#0066CC;text-decoration-color:currentColor}
html.classic .sepBanner{background:#FFFFE1;border:1px solid #C9C28A;color:#000}
html.classic .profileHead{gap:12px}
html.classic dl.kv{gap:4px 12px}
html.classic dl.kv dt{font:11px Tahoma,"Segoe UI",Arial,sans-serif;letter-spacing:0;text-transform:none;color:#444}
html.classic dl.kv dd{font-weight:normal}
/* service history */
html.classic .ev{padding:6px 0;gap:8px}
html.classic .ev .when{font:11px Tahoma,"Segoe UI",Arial,sans-serif;letter-spacing:0;text-transform:none;color:#444}
html.classic .ev .dot::before{background:#C0C0C0;width:1px;left:8px}
html.classic .ev .dot::after{border-radius:0;width:9px;height:9px;left:4px;top:4px;border:1px solid #707070;background:#fff}
html.classic .ev.now .dot::after{background:#3399FF;border-color:#1F6FBF;box-shadow:none}
html.classic .ev:hover .dot::after,html.classic .ev:hover .what{transform:none}
html.classic .ev .what b{font:bold 12px Tahoma,"Segoe UI",Arial,sans-serif;letter-spacing:0;text-transform:none;color:#000}
html.classic .ev .what .sub{font-size:11px;color:#444}
html.classic .evTools{opacity:1}
html.classic .iconBtn{border-radius:2px;width:22px;height:22px}
html.classic .iconBtn:hover{background:#E5F3FB;color:#000;transform:none}
html.classic .iconBtn.del:hover{background:#FDE8E6;color:#B00000}
html.classic .orderLink,html.classic .clipLink,html.classic .subtle{color:#0066CC}
html.classic .caret{border-radius:0}
html.classic .caret:hover{background:#E5F3FB;color:#000}
html.classic .svcRight{border-radius:0;border-color:#A0A0A0}
html.classic .svcRightBar{background:linear-gradient(#FFFFFF,#E9E9E9);color:#000;border-bottom:1px solid #A0A0A0;padding:3px 6px 3px 8px}
html.classic .svcRightTitle{font:bold 12px Tahoma,"Segoe UI",Arial,sans-serif;letter-spacing:0;text-transform:none}
html.classic .svcRightBar .svcOpenNew{color:#0066CC}
html.classic .svcClose{color:#000;border-radius:2px;width:22px;height:20px;font-size:15px}
html.classic .svcClose:hover{background:#E81123;color:#fff}
/* dialogs */
html.classic .overlay{backdrop-filter:none;-webkit-backdrop-filter:none}
html.classic .modal{border-radius:0;border:1px solid #707070;box-shadow:0 4px 14px rgba(0,0,0,.25)}
html.classic .modal header{background:linear-gradient(#FFFFFF,#E3E3E3);color:#000;padding:5px 6px 5px 10px;border-bottom:1px solid #A0A0A0}
html.classic .modal header .label{color:#444}
html.classic .modal header h2{font-size:13px;font-weight:bold}
html.classic .modal header h2::before{display:none}
html.classic .x{color:#000;width:24px;height:20px;font-size:15px;border-radius:2px;border:1px solid #8E8F8F;background:linear-gradient(#FDFDFD,#E1E1E1)}
html.classic .x:hover{background:#E81123;border-color:#C50F1F;color:#fff;transform:none}
html.classic .modal .body{padding:10px 12px;gap:10px}
html.classic .modal footer{background:#F0F0F0;border-top:1px solid #A0A0A0;padding:6px 12px}
html.classic fieldset{gap:6px}
html.classic legend{font:bold 12px Tahoma,"Segoe UI",Arial,sans-serif;letter-spacing:0;text-transform:none;color:#000;border-bottom-color:#D0D0D0;margin-bottom:4px}
html.classic .fgrid{gap:6px 10px}
html.classic .f{gap:2px}
html.classic .f label{font-size:11px;font-weight:normal;color:#000}
html.classic .f .hint{font-size:11px;color:#444}
html.classic .f .err{font-size:11px;color:#B00000}
html.classic .formErr{border-radius:0;border:1px solid #B00000;background:#FDE8E6;color:#B00000;font-weight:normal;padding:5px 8px}
html.classic .current{border-radius:0;background:#F0F0F0;border:1px solid #A0A0A0;border-left:3px solid #3C7FB1;padding:6px 8px}
html.classic .note{border-radius:0;background:#FFFFE1;border:1px solid #C9C28A;padding:6px 8px}
html.classic .note.warnNote{background:#FFF6E8;border-color:#D08A3A}
html.classic .newSeat{border:1px dashed #A0A0A0;border-radius:0;background:#FFFFE1}
html.classic .nsHead b{font:bold 12px Tahoma,"Segoe UI",Arial,sans-serif;text-transform:none;letter-spacing:0}
html.classic .colPick label{border-radius:0;font-size:12px;padding:3px 6px}
html.classic .colPick label:has(input:checked){border-color:#3399FF;background:#CCE8FF}
html.classic .preview{border-radius:0;border-color:#A0A0A0}
/* search suggestions */
html.classic .sugg{border-radius:0;border:1px solid #707070;box-shadow:2px 2px 6px rgba(0,0,0,.25);padding:2px;top:calc(100% + 2px)}
html.classic .sgh{font:11px Tahoma,"Segoe UI",Arial,sans-serif;letter-spacing:0;text-transform:none;color:#444;padding:4px 6px 2px}
html.classic .sgr,html.classic .sgx{border-radius:0}
html.classic .sgr:hover,html.classic .sgr.on{background:#CCE8FF}
html.classic .sgi{padding:3px 6px;gap:6px;font-weight:normal}
html.classic .sgi .av,html.classic .sgic{width:20px;height:20px;border-radius:0;font-size:9px}
/* messages */
html.classic .toast{bottom:34px;background:#fff;color:#000;border:1px solid #707070;border-radius:0;box-shadow:0 3px 10px rgba(0,0,0,.2);font:12px Tahoma,"Segoe UI",Arial,sans-serif;padding:6px 12px}
html.classic .toast::before{display:none}
html.classic .toast.err{background:#FDE8E6;color:#B00000;border-color:#B00000}
html.classic .spin{border-color:#D0D0D0;border-top-color:#3399FF;width:32px;height:32px;border-width:3px}
html.classic .pubBadge{top:44px;right:10px;background:#FFFFE1;color:#000;border:1px solid #C9C28A;border-radius:0;box-shadow:none;font:12px Tahoma,"Segoe UI",Arial,sans-serif;letter-spacing:0;text-transform:none;padding:3px 8px}
html.classic .pubBadge i{background:#C62828;box-shadow:none}
html.classic .pubBadge:hover{filter:none;transform:none;background:#FFF8C4}
/* status bar along the bottom, like a Windows program */
html.classic .statusbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:#F0F0F0;border-top:1px solid #A0A0A0;padding:3px 10px;gap:14px;align-items:center;font:12px Tahoma,"Segoe UI",Arial,sans-serif;color:#000;flex-wrap:wrap}
html.classic .statusbar:empty{display:none}
.statusbar .sb-msg{flex:1;min-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.statusbar .sb{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.statusbar .sb b{font-weight:normal;border:1px solid #6BA368;background:#F2FFF0;color:#1B6E1B;padding:0 8px;min-width:40px;text-align:center}
.statusbar .sb b.warn{border-color:#D08A3A;background:#FFF6E8;color:#8A4A00}
@media (max-width:1480px){html:not(.classic) .who{display:none}}
@media (max-width:780px){html.classic body{font-size:13px}}
@media (max-width:680px){html.classic .statusbar{display:none}html.classic .toast{bottom:16px}html.classic .sync{bottom:10px}}
/* Organizational chart */
.org{display:grid;gap:22px;min-width:0}
.oApex{display:grid;justify-items:center}
.oBar{font:700 1.35rem var(--cond);letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--grad);padding:8px 34px;border-radius:12px;box-shadow:var(--shadow-card);margin-bottom:14px;text-align:center}
.oStem{display:block;width:2px;height:20px;background:var(--line-2)}
.oApex .oStem:last-child{margin-bottom:-22px}
.oc{display:flex;gap:10px;align-items:center;text-align:left;width:100%;min-width:0;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--plantilla);border-radius:12px;padding:8px 10px;cursor:pointer;transition:box-shadow .25s var(--ease),transform .25s var(--ease)}
.oc.cos{border-left-color:var(--orange)}
.oc:hover{box-shadow:var(--shadow-card-hi);transform:translateY(-1px)}
.oc .av{width:44px;height:44px}
.ocT{display:grid;gap:1px;min-width:0}
.ocT b{font-size:.76rem;line-height:1.2;color:var(--head);overflow-wrap:anywhere}
.ocT > span{font-size:.7rem;color:var(--muted);line-height:1.25;overflow-wrap:anywhere}
.ocT .ocR{color:var(--orange-2);font-weight:600}
.ocTags{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.oc.head{width:auto;min-width:min(100%,250px);max-width:360px;border:1px solid var(--line);border-top:3px solid var(--orange);padding:10px 14px;box-shadow:var(--shadow-card)}
.oc.head .av{width:58px;height:58px;border-radius:14px}
.oc.head .ocT b{font-size:.92rem}
.od{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-card);overflow:hidden;min-width:0}
.odH{display:flex;justify-content:space-between;align-items:baseline;gap:6px 12px;flex-wrap:wrap;background:var(--grad);color:#fff;padding:10px 18px}
.odH h2{color:#fff;font-size:1.35rem}
.odH > span{font-size:.8rem;opacity:.92}
.odB{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding:16px;justify-items:center;min-width:0}
.odS{display:flex;flex-wrap:wrap;gap:14px;width:100%;align-items:flex-start}
.os{flex:var(--cols,1) 1 calc(var(--cols,1) * 205px);min-width:min(100%,230px);border:1px solid var(--line-2);border-radius:14px;background:var(--soft);display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding:0 10px 10px;justify-items:center;align-content:start}
.osH{justify-self:stretch;margin:0 -10px;padding:7px 12px;background:var(--plantilla-soft);color:var(--head);font:700 1rem var(--cond);letter-spacing:.05em;text-transform:uppercase;text-align:center;border-radius:13px 13px 0 0;border-bottom:1px solid var(--line-2)}
.osH small,.ouH small{font:500 .72rem var(--body);letter-spacing:0;text-transform:none;color:var(--muted);margin-left:4px}
.osU{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;width:100%;align-items:start}
.os.bare{border-color:transparent;background:none}
.os.bare > .osH,.os.bare > .oVac{visibility:hidden}
@media (max-width:680px){.os.bare > .osH,.os.bare > .oVac{display:none}}
.os.lead{justify-items:stretch}
.os.lead > .oc.head{justify-self:start}
.os.lead > .oNone{justify-self:start}
.osU.under{width:auto;margin-left:26px;padding-left:12px;border-left:2px solid var(--line-2);grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.ou{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:subgrid;grid-row:span 2;gap:6px;align-content:start;min-width:0}
.ouB{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;align-content:start;min-width:0}
.ouH{background:linear-gradient(140deg,#1E63C9 0%,#0D47A1 42%,#0A2E6E 100%);color:#fff;border-radius:10px;font:700 .8rem/1.12 var(--cond);letter-spacing:.05em;text-transform:uppercase;text-align:center;padding:4px 10px;height:56px;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;text-wrap:balance}
.ouH.or{background:linear-gradient(140deg,#F9A13A 0%,#F26522 58%,#E2541A 100%)}
.oNone{font-size:.76rem;color:var(--muted);border:1px dashed var(--line-2);border-radius:10px;padding:6px 12px;text-align:center}
.oVac{display:grid;align-content:center;gap:2px;min-width:min(100%,250px);min-height:100px;border-width:2px;border-radius:12px;background:var(--card)}
.oVac b{font-size:.92rem;color:var(--head);letter-spacing:.04em;text-transform:uppercase}
.oc{min-height:58px}
.oc.head{min-height:100px}
body.wide main{max-width:none}
.ot{display:flex;flex-direction:column;align-items:center;min-width:0}
.otFit{width:100%;overflow-x:auto;padding-bottom:4px}
.ot.root{width:max-content;margin:0 auto}
.otKids{display:flex;align-items:flex-start;justify-content:center}
.otK{position:relative;padding:20px 7px 0;display:flex;justify-content:center;min-width:0}
.otK::before{content:"";position:absolute;top:0;left:0;right:0;height:20px;border-top:2px solid var(--wire)}
.otK::after{content:"";position:absolute;top:0;left:calc(50% - 1px);width:2px;height:20px;background:var(--wire)}
.otK:first-child::before{left:calc(50% - 1px);border-left:2px solid var(--wire);border-top-left-radius:12px}
.otK:last-child::before{right:calc(50% - 1px);border-right:2px solid var(--wire);border-top-right-radius:12px}
.otK:first-child::after,.otK:last-child::after{display:none}
.otK:only-child::before{display:none}
.otK:only-child::after{display:block}
.org{--wire:#9DB2D3}
.org .oStem{background:var(--wire);flex:none}
.otL{width:var(--ocW,250px);display:grid;grid-template-columns:minmax(0,1fr);gap:6px;align-content:start}
.otL > .oc.head,.otS > .oc.head,.ot > .oc.head{width:var(--ocW,250px);min-width:0;max-width:none}
.ot > .ouH{width:var(--ocW,250px);margin-bottom:6px}
.oSkip{display:block;height:40px;flex:none;align-self:stretch}
.oc.ghost,.ouH.ghost,.otSH.ghost{position:relative;background:none!important;border-color:transparent!important;box-shadow:none!important;pointer-events:none;cursor:default}
.oc.ghost > *,.ouH.ghost > *,.otSH.ghost > *{visibility:hidden}
.oc.ghost::before,.ouH.ghost::before,.otSH.ghost::before{content:"";position:absolute;left:calc(50% - 1px);top:-8px;bottom:-8px;width:2px;background:var(--wire)}
.oSkip{position:relative}
.oSkip::before{content:"";position:absolute;left:calc(50% - 1px);top:-8px;bottom:-8px;width:2px;background:var(--wire)}
.otL > .oc.ghost:last-child::before,.otS > .oc.ghost:last-child::before{display:none}
.org .odB{background-color:var(--card);background-image:radial-gradient(circle,rgba(13,71,161,.13) 1.2px,transparent 1.5px);background-size:22px 22px}
.org .oc,.org .oc.cos,.org .oc.head{border:0;box-shadow:0 6px 16px rgba(16,41,90,.10),0 1px 4px rgba(16,41,90,.07)}
.org .oc:hover{box-shadow:0 10px 24px rgba(16,41,90,.16),0 2px 6px rgba(16,41,90,.08)}
.org .oVac{background:rgba(255,255,255,.85)}
/* Cards: fixed heights worked out from the rows shown (see orgDim), photo = 90% of the card height with the same margin left as top */
.org .odB .oc{--h:var(--chS,63px);height:var(--h);min-height:0;padding:0 10px 0 0;gap:0;align-items:center}
.org .odB .oc.head{--h:var(--chH,72px)}
.org .odB .oc.head.r{--h:calc(var(--chH,72px) + 16px)}
.org .odB .oc .av{height:calc(var(--h) * .9);width:calc(var(--h) * .9);margin:0 calc(var(--h) * .05 + 6px) 0 calc(var(--h) * .05);border-radius:10px;box-shadow:none}
.org .odB .ocT{gap:1px;align-content:center}
.org .odB .ocT b{display:block;font-size:12.2px;line-height:16px;min-height:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.org .odB .oc.head .ocT b{font-size:14.4px;line-height:18px}
.org .odB .n2s .oc:not(.head) .ocT b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:normal;height:32px}
.org .odB .n2h .oc.head .ocT b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:normal;height:36px}
.org .odB .ocT > .ocP,.org .odB .ocT > .ocR{font-size:11.2px;line-height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.org .odB .ocT > .ocR{line-height:15px}
.org .odB .oc .ocTags{height:18px;min-height:0;margin-top:1px;align-items:center}
.org .odB .oVac{height:var(--chH,72px);min-height:0;width:var(--ocW,250px);min-width:0;padding:0 10px}
.otSH.or{background:linear-gradient(140deg,#F9A13A 0%,#F26522 58%,#E2541A 100%)}
.otSH.bl{background:linear-gradient(140deg,#1E63C9 0%,#0D47A1 42%,#0A2E6E 100%)}
html.classic .org .oc,html.classic .org .oc.cos,html.classic .org .oc.head{border:1px solid #B8B8B8;box-shadow:none}
.ocT b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.4em}
.ocT > .ocP{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ocT .ocO{font-style:normal;font-weight:700;color:var(--orange-2)}
.oc .ocTags{min-height:19px;flex-wrap:nowrap;overflow:hidden}
.oc .ocTags .pill{font-size:.64rem;padding:1px 7px}
.otS{width:var(--ocW,250px);display:flex;flex-direction:column;gap:8px;align-items:center}
.otSH{align-self:stretch;padding:4px 12px;background:#0F2A5C;color:#fff;font:700 .88rem/1.12 var(--cond);letter-spacing:.05em;text-transform:uppercase;text-align:center;border-radius:10px;height:48px;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;text-wrap:balance}
.otSH small,.ouH small{font:700 .68rem var(--body);letter-spacing:0;background:rgba(255,255,255,.22);color:#fff;border-radius:999px;min-width:20px;height:20px;padding:0 6px;display:flex;align-items:center;justify-content:center;flex:none;margin:0}
.ot > .otSH{margin-bottom:8px}
.otUnder{width:var(--ocW,250px);display:grid;gap:6px}
.otS > .oc.head,.otS > .oVac{max-width:100%}
@media (max-width:680px){.ot.root{width:100%}.otKids{flex-direction:column;align-items:stretch;width:100%}.otK{padding:8px 0 0}.otK::before,.otK::after{display:none}.otL,.otS{width:100%}.ot{align-items:stretch}.oc.ghost,.ouH.ghost,.otSH.ghost,.oSkip{display:none}.otL > .oc.head,.otS > .oc.head,.ot > .oc.head,.ot > .ouH{width:100%}}
html.classic .org{--wire:#808080}
html.classic .otSH,html.classic .ouH{border-radius:0;font:bold 11px/1.15 Tahoma,"Segoe UI",Arial,sans-serif;text-transform:none;letter-spacing:0}
html.classic .otSH small,html.classic .ouH small{font:bold 10px Tahoma,"Segoe UI",Arial,sans-serif;color:#fff}
.oMore{width:100%}

<script>
/* Safety net: if the app breaks while starting, say why instead of loading forever */
window.__booted = false; window.__errs = [];
window.__ME = '';
window.__bootFail = function (title, msg) {
  var v = document.getElementById('view'); if (!v) return;
  var e = function (x) { return String(x).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); };
  v.innerHTML = '<div class="loading"><h2>' + e(title) + '</h2><p class="muted" style="max-width:62ch">' + msg +
    '</p><p class="muted" style="max-width:62ch;font-size:.9rem">Tip: open the file in <b>Notepad</b> (right-click → Open with → Notepad), press Ctrl+A then Ctrl+C, ' +
    'and in Apps Script click the file, press Ctrl+A then Ctrl+V, and Save. Then pick <b>checkApp</b> in the function dropdown and press Run to check every file.</p>' +
    '<button class="btn" onclick="location.reload()">Try again</button></div>';
};
window.addEventListener('error', function (ev) { window.__errs.push((ev.message || 'Error') + (ev.lineno ? ' (line ' + ev.lineno + ')' : '')); });
/* Returns true when every part of the page loaded; otherwise shows what's wrong and returns false */
window.__partsOk = function () {
  var miss = window.__missing || [];
  if (miss.length) { window.__bootFail('A file is missing', 'Apps Script has no HTML file named <b>' + miss.join(', ') + '</b>. Click Files ＋ → HTML, name it exactly that, and paste in the file with the same name.'); return false; }
  var n = window.__nparts || 0;
  for (var i = 1; i <= n; i++) if (!window['__part' + i]) { window.__bootFail('Script' + i + ' didn\'t load',
    'The <b>Script' + i + '</b> file has a problem' + (window.__errs.length ? ' (' + window.__errs[0].replace(/[&<>]/g, '') + ')' : '') + '. Paste Script' + i + '.html again, all of it.'); return false; }
  if (!n && !window.__appReady) { window.__bootFail('The page\'s code didn\'t load', window.__errs.length ? window.__errs[0].replace(/[&<>]/g, '') : 'Unknown problem.'); return false; }
  return true;
};
window.addEventListener('load', function () {
  if (window.__booted) return;
  if (window.__partsOk() && window.__errs.length) window.__bootFail('Something broke while starting', window.__errs[0].replace(/[&<>]/g, ''));
});
setTimeout(function () {
  var v = document.getElementById('view');
  if (!window.__booted && v && /Loading the masterlist/.test(v.textContent)) window.__bootFail('Still loading after 30 seconds', 'The page never heard back from the server. Run checkApp in the Apps Script editor.');
}, 30000);
</script>
<script>

};
const $ = (s, el) => (el || document).querySelector(s);
const esc = v => String(v === undefined || v === null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const peso = n => n === '' || n === null || n === undefined || isNaN(n) ? '—' : '₱' + Number(n).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fmtDate = s => { if (!s) return '—'; const [y, m, d] = String(s).split('-').map(Number); return MONTHS[m - 1] + ' ' + d + ', ' + y; };
const toDate = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
const iso = dt => dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
const ageOn = (b, on) => { if (!b) return ''; const B = toDate(b), T = toDate(on); let a = T.getFullYear() - B.getFullYear(); if (T.getMonth() < B.getMonth() || (T.getMonth() === B.getMonth() && T.getDate() < B.getDate())) a--; return a; };
const yearsBetween = (a, b) => a ? Math.max(0, Math.round(((toDate(b) - toDate(a)) / 31557600000) * 10) / 10) : '';
const canEdit = () => D && (D.me.role === 'Admin' || D.me.role === 'Editor');
const mailto = e => (e ? `<a class="mail" href="mailto:${esc(e)}" title="Send an email to ${esc(e)}">${esc(e)}</a>` : '—');

/* ═══════════════════════ server bridge ═══════════════════════ */
const inAppsScript = () => !!(window.google && google.script && google.script.run);
function call(fn, arg) {
  if (!inAppsScript()) return api(fn, arg);
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(e => reject(new Error((e && e.message) || String(e))))[fn](arg);
  });
}

/* ═══════════════════════ sign-in (boerecords.online) ═══════════════════════ */
/* The page lives on GitHub; the data stays in the Google Sheet. Each request goes to the Apps Script /exec link
   (window.EDMS_API, set in config.js) with the sign-in pass from the Accounts tab. */
const SESSION_KEY = 'boe.session';
let SESSION = null;
function readSession() {
  try { const s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); return s && s.token && s.exp > Date.now() ? s : null; }
  catch (e) { return null; }
}
function writeSession(s) {
  SESSION = s;
  try { if (s) localStorage.setItem(SESSION_KEY, JSON.stringify(s)); else localStorage.removeItem(SESSION_KEY); } catch (e) { /* private window: stays for this visit only */ }
}
async function api(fn, arg) {
  const url = String(window.EDMS_API || '').trim();
  if (!/^https?:\/\/\S+$/.test(url)) throw new Error('The server link isn\'t set yet. Paste the Apps Script /exec link in config.js on GitHub.');
  let r, j;
  try { r = await fetch(url, { method: 'POST', body: JSON.stringify({ fn: fn, arg: arg === undefined ? null : arg, token: SESSION ? SESSION.token : '' }) }); }
  catch (e) { throw new Error('Couldn\'t reach the server. Check your internet connection and try again.'); }
  try { j = await r.json(); }
  catch (e) { throw new Error('The server sent back something unexpected (' + r.status + '). Check the link in config.js, and that the Apps Script is deployed for Anyone.'); }
  if (j && j.ok) return j.result;
  const msg = (j && j.error) || 'The server said no.';
  if (j && j.signIn && fn !== 'signIn') signOut(msg);
  throw new Error(msg);
}
function start() {
  if (inAppsScript()) return boot();
  SESSION = readSession();
  if (!SESSION) return showSignIn();
  window.__ME = SESSION.user;
  boot();
}
function showSignIn(note) {
  window.__booted = true;                                   // the "still loading" safety net must not fire behind this screen
  $('#top').hidden = true; closeModal();
  const sb = $('#statusbar'); if (sb) sb.innerHTML = '';
  let last = ''; try { last = localStorage.getItem('boe.lastEmail') || ''; } catch (e) { /* ignore */ }
  $('#view').innerHTML = `<div class="signin"><div class="siBox">
    <div class="siTitle">BOE Employee Database</div>
    <div class="siBody">
      <div class="siHead"><img class="siLogo" src="assets/dpwh-logo.png" alt="DPWH" onerror="this.outerHTML='<div class=&quot;seal&quot;>BOE</div>'"><div><b>Sign in</b><span>Bureau of Equipment · DPWH</span></div></div>
      ${note ? `<div class="siNote">${esc(note)}</div>` : ''}
      <form id="siEmailForm" class="siStep" novalidate>
        <label class="siField"><span>DPWH email</span><input id="siEmail" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="name@dpwh.gov.ph"></label>
        <div class="siErr" id="siErr1" role="alert" hidden></div>
        <button class="btn primary siGo" id="siSend" type="submit">Send me a code</button>
      </form>
      <form id="siCodeForm" class="siStep" novalidate hidden>
        <p class="siSent" id="siSent"></p>
        <label class="siField"><span>6-digit code</span><input id="siCode" class="siCodeIn" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*"></label>
        <div class="siErr" id="siErr2" role="alert" hidden></div>
        <button class="btn primary siGo" id="siVerify" type="submit">Sign in</button>
        <div class="siRow"><button type="button" class="siLink" id="siResend" disabled>Send a new code</button><button type="button" class="siLink" id="siBack">Use a different email</button></div>
      </form>
      <p class="siHelp">No account? Ask the BOE administrator to add your DPWH email.</p>
    </div></div></div>`;
  const touch = matchMedia('(pointer: coarse)').matches;
  let email = '', timer = null;
  const err = (id, m) => { const e = $(id); e.textContent = m || ''; e.hidden = !m; };
  const busy = (btn, on, label) => { btn.disabled = on; btn.textContent = label; };
  const countdown = secs => {
    const r = $('#siResend'); clearInterval(timer);
    let left = secs;
    const tick = () => { if (!document.body.contains(r)) return clearInterval(timer); r.disabled = left > 0; r.textContent = left > 0 ? 'Send a new code (' + left + ')' : 'Send a new code'; if (left-- <= 0) clearInterval(timer); };
    tick(); timer = setInterval(tick, 1000);
  };
  const send = async (btn, idleLabel) => {
    busy(btn, true, 'Sending…'); err('#siErr1'); err('#siErr2');
    try {
      const r = await api('sendCode', { email: email });
      try { localStorage.setItem('boe.lastEmail', email); } catch (e) { /* ignore */ }
      $('#siEmailForm').hidden = true; $('#siCodeForm').hidden = false;
      $('#siSent').innerHTML = 'We emailed a 6-digit code to <b>' + esc(r.email) + '</b>. It works for ' + r.minutes + ' minutes. Not there? Check Spam.';
      $('#siCode').value = ''; if (!touch) $('#siCode').focus();
      countdown(r.resend || 60);
    } catch (e) {
      err($('#siCodeForm').hidden ? '#siErr1' : '#siErr2', e.message);
    } finally { if (btn.id === 'siSend') busy(btn, false, idleLabel); else if (btn.textContent.indexOf('Sending') === 0) busy(btn, false, 'Send a new code'); }
  };
  $('#siEmail').value = last;
  if (!touch) $('#siEmail').focus();
  $('#siEmailForm').addEventListener('submit', ev => {
    ev.preventDefault();
    email = $('#siEmail').value.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return err('#siErr1', 'Type your DPWH email address.');
    send($('#siSend'), 'Send me a code');
  });
  $('#siResend').addEventListener('click', () => send($('#siResend'), 'Send a new code'));
  $('#siBack').addEventListener('click', () => { clearInterval(timer); $('#siCodeForm').hidden = true; $('#siEmailForm').hidden = false; err('#siErr1'); if (!touch) $('#siEmail').select(); });
  $('#siCode').addEventListener('input', ev => {
    const v = ev.target.value.replace(/\D/g, '').slice(0, 6);
    if (v !== ev.target.value) ev.target.value = v;
    if (v.length === 6 && !$('#siVerify').disabled) $('#siCodeForm').requestSubmit();
  });
  $('#siCodeForm').addEventListener('submit', async ev => {
    ev.preventDefault();
    const code = $('#siCode').value.replace(/\D/g, ''), go = $('#siVerify');
    if (code.length !== 6) return err('#siErr2', 'Type the 6-digit code from the email.');
    busy(go, true, 'Signing in…'); err('#siErr2');
    try {
      const r = await api('verifyCode', { email: email, code: code });
      clearInterval(timer);
      writeSession({ token: r.token, user: r.me.email, name: r.me.name, role: r.me.role, exp: Date.now() + r.days * 86400000 - 60000 });
      window.__ME = r.me.email; window.__booted = false;
      $('#view').innerHTML = '<div class="loading"><div class="spin"></div><span class="label">Loading the masterlist…</span></div>';
      boot();
    } catch (e) {
      err('#siErr2', e.message); busy(go, false, 'Sign in');
      if (/new one/.test(e.message)) $('#siCode').value = ''; else $('#siCode').select();
    }
  });
}

}

/* ═══════════════════════ indexes ═══════════════════════ */
function index(d) {
  const by = (arr, k) => { const m = {}; arr.forEach(r => { m[r[k]] = r; }); return m; };
  const group = (arr, k) => { const m = {}; arr.forEach(r => { (m[r[k]] = m[r[k]] || []).push(r); }); return m; };
  const byDateDesc = (a, b) => (String(b['Effective Date'] || '').localeCompare(String(a['Effective Date'] || ''))) || String(b['Entry ID']).localeCompare(String(a['Entry ID']));
  const ix = {
    emp: by(d.employees, 'Employee Number'), hist: group(d.hist, 'Employee Number'), pd: by(d.pd, 'Entry ID'), cd: by(d.cd, 'Entry ID'),
    pos: by(d.pos, 'Position Title'), off: by(d.off, 'Office Code'), seat: by(d.seats, 'Item Number'),
    ids: group(d.ids, 'Employee Number'), elig: group(d.elig, 'Employee Number'), edu: group(d.edu, 'Employee Number'),
    pwd: group(d.pwd, 'Employee Number'), names: group(d.names, 'Employee Number'), emails: group(d.emails || [], 'Employee Number'), sepd: by(d.sepd || [], 'Entry ID'), rates: {}, cur: {}, holder: {},
    lic: group(d.lic || [], 'Employee Number'),

  saveJobChange(d, p) {

  saveNameChange(d, p) {

    if (oldLast === nl) throw new Error('The new last name is the same as the current one.');
    d.names.push({ 'Change ID': nextIn(d.names, 'Change ID', 'NC', 4), 'Employee Number': p.employeeId, 'Old Last Name': oldLast, 'New Last Name': nl,
      'Date Effective': p.date, 'Reason': p.reason || '', 'Document / Reference': sv(p.document) });

  },
  savePersonal(d, p) {
