  saveUser(d, p) {
    if (d.me.role !== 'Admin') throw new Error('Only an Admin can add or change users.');
    const email = sv(p.email).toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw new Error('Enter a valid email address.');
    const role = ['Admin', 'Editor', 'Viewer'].includes(p.role) ? p.role : 'Viewer', active = p.active === 'No' ? 'No' : 'Yes';
    if (email === d.me.email && (role !== 'Admin' || active === 'No')) throw new Error('You can\'t remove your own Admin access. Ask another Admin to do it.');
    d.users = d.users || [];
    const u = d.users.find(x => x.email === email);
    if (u) Object.assign(u, { name: sv(p.name), role: role, active: active }); else d.users.push({ email: email, name: sv(p.name), role: role, active: active });
    logL(d, u ? 'User changed' : 'User added', email, role + ' · active: ' + active);

  },
  savePhoto(d, p) {
    empL(d, p.employeeId);
    if (p.photo) { isImg(p.photo, 'Photo'); isImg(p.thumb, 'Thumbnail'); }

    else { delete d.thumbs[p.employeeId]; d._photoLocal[p.employeeId] = ''; }

  },
  separateEmployee(d, p) {
    needL(p.date, 'Date of separation'); needL(p.cause, 'Cause');
    const e = empL(d, p.employeeId), cur = (index(d).hist[p.employeeId] || [])[0];
    if (cur && cur['Change Type'] === 'Separation') throw new Error('This person is already separated.');
    const entry = addJobL(d, p.employeeId, { changeType: 'Separation', date: p.date, order: p.order, remarks: p.cause + (p.notes ? ' — ' + p.notes : '') }, false);
    (d.sepd = d.sepd || []).push({ 'Entry ID': entry, 'Cause': sv(p.cause), 'Notes': sv(p.notes) });
    logL(d, 'Separated', p.employeeId, e['Last Name'] + ', ' + e['First Name'] + ' · ' + p.cause);
    return { id: p.employeeId, entries: [entry] };
  },
  saveSettings(d, p) {
    if (d.me.role !== 'Admin') throw new Error('Only an Admin can change settings.');
    if ((d.needsUpgrade || []).includes('Settings')) throw new Error('Settings are not set up yet. Run upgradeSheets once.');
    if (p.agency !== undefined) d.agency = sv(p.agency) || 'Bureau of Equipment';

    if (p.coeTitle !== undefined) d.coe.title = sv(p.coeTitle);
    if (p.coePlace !== undefined) d.coe.place = sv(p.coePlace);
    logL(d, 'Settings changed', '', 'Branding');
    return { id: '' };
  }
};

function go(view, id) {
  const parts = String(view).split('/');
  S.view = parts[0] || 'dashboard'; S.id = id || parts[1] || null;
  if (S.view === 'users') S.view = 'admin';
  if (!['dashboard', 'employees', 'profile', 'seats', 'org', 'reports', 'admin'].includes(S.view)) S.view = 'dashboard';
  if ($('#modalRoot').innerHTML) closeModal();
  if (S.view === 'profile' && S.id) { rememberProfile(S.id); if (S.q) rememberSearch(S.q); }
  try { history.replaceState(null, '', '#' + S.view + (S.id ? '/' + S.id : '')); } catch (e) { /* some frames block this */ }
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.go === (S.view === 'profile' ? 'employees' : S.view) ? 'page' : 'false'));
  render(true); window.scrollTo(0, 0);
}

function render(animate) {

function softRender() {
  if (!D || !$('#top') || $('#top').hidden) return;
  const html = VIEWS()[S.view]();
  if (html === LAST_HTML) return;
  const dirty = Array.from(document.querySelectorAll('#view input, #view select, #view textarea')).some(el =>
    el.type === 'checkbox' || el.type === 'radio' ? el.checked !== el.defaultChecked : el.tagName === 'SELECT' ? Array.from(el.options).some(o => o.selected !== o.defaultSelected) : el.value !== el.defaultValue);
  if (dirty) return;
  LAST_HTML = html; $('#view').innerHTML = html; afterRender();
}
/* Big numbers count up when the dashboard opens */
function countUp() {
  if (document.documentElement.classList.contains('classic')) return;      // Simple view: numbers just appear
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('#view [data-count]').forEach(el => {
    const end = Number(el.dataset.count), t0 = performance.now();
    const step = t => { const k = Math.min(1, (t - t0) / 800); el.textContent = Math.round(end * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
    el.textContent = '0'; requestAnimationFrame(step);
  });
}

function fixTest(key, e) {

/* The "Order: ..." line. With a scanned order on Drive it is an orange link that opens the file;
   with a file but no reference number it still links, labelled "Scanned order"; otherwise plain grey. */
function orderLine(x) {
  const ref = sv(x['Order / Reference']), file = sv(x['Order File']);
  if (file) return `<span class="sub"><a class="orderLink" href="${esc(file)}" target="_blank" rel="noopener" data-act="orderPreview" data-file="${esc(file)}" data-ref="${esc(ref || 'Scanned order')}">${ICON.clip} Order: ${esc(ref || 'Scanned order')}</a></span>`;
  return ref ? `<span class="sub">Order: ${esc(ref)}</span>` : '';
}
/* Turn a Google Drive share link into its embeddable preview URL. */
function drivePreview(u) {
  const s = String(u || ''), m = s.match(/\/d\/([-\w]{10,})/) || s.match(/[?&]id=([-\w]{10,})/);
  return m ? 'https://drive.google.com/file/d/' + m[1] + '/preview' : s;
}
/* Open the reference scan in the right half of the Service history box. */
function openOrderPreview(file, ref) {
  const split = $('#svcSplit'), right = $('#svcRight'), viewer = $('#svcViewer'), title = $('#svcRefTitle'), openNew = $('#svcRefOpen');
  if (!split || !viewer) { window.open(file, '_blank', 'noopener'); return; }
  if (title) title.textContent = ref || 'Scanned order';
  if (openNew) openNew.href = file;
  viewer.innerHTML = '<div class="svcLoad">Loading the scan…</div>';
  const ifr = document.createElement('iframe');
  ifr.src = drivePreview(file); ifr.setAttribute('title', 'Reference file preview'); ifr.setAttribute('loading', 'eager');
  ifr.addEventListener('load', () => { const l = viewer.querySelector('.svcLoad'); if (l) l.remove(); });
  viewer.appendChild(ifr);
  split.classList.add('open'); right.setAttribute('aria-hidden', 'false');
  if (window.matchMedia && window.matchMedia('(max-width:780px)').matches) setTimeout(() => right.scrollIntoView({ behavior: 'smooth', block: 'start' }), 140);
}
function closeOrderPreview() {
  const split = $('#svcSplit'), right = $('#svcRight'), viewer = $('#svcViewer');
  if (!split) return;
  split.classList.remove('open'); if (right) right.setAttribute('aria-hidden', 'true');
  setTimeout(() => { if (viewer && !split.classList.contains('open')) viewer.innerHTML = ''; }, 520);
}

const PRC_PROFESSIONS = ['Professional Civil Engineer', 'Registered Civil Engineer', 'Professional Mechanical Engineer', 'Registered Mechanical Engineer',
  'Certified Plant Mechanic', 'Professional Electrical Engineer', 'Registered Electrical Engineer', 'Registered Electronics Engineer',
  'Professional Electronics Engineer', 'Registered Electronics Technician', 'Geodetic Engineer', 'Registered Chemical Engineer',
  'Registered Sanitary Engineer', 'Registered Metallurgical Engineer', 'Registered Mining Engineer', 'Registered Naval Architect and Marine Engineer',
  'Registered Materials Engineer', 'Registered Master Plumber', 'Registered Architect', 'Certified Public Accountant', 'Licensed Agricultural and Biosystems Engineer'];
const profDatalist = () => '<datalist id="profList">' + PRC_PROFESSIONS.map(p => `<option value="${esc(p)}">`).join('') + '</datalist>';
function hasRA1080(id) { return (IX.elig[id] || []).some(x => /ra\s*1080|board|bar/i.test(String(x['Eligibility / Exam']))); }
/* Valid / Expiring soon / Expired, from Valid Until against today */
function licStatus(validUntil) {
  if (!validUntil) return { label: 'No expiry on file', cls: 'vacant', days: null };
  const days = Math.round((toDate(validUntil) - toDate(D.today)) / 86400000);
  if (days < 0) return { label: 'Expired', cls: 'bad', days: days };
  if (days <= 183) return { label: 'Expires in ' + days + ' day' + (days === 1 ? '' : 's'), cls: 'warn', days: days };
  return { label: 'Valid', cls: 'filled', days: days };
}
/* Newest licence first: by Valid Until, then Registration Date */
const licSort = (a, b) => String(b['Valid Until'] || '').localeCompare(String(a['Valid Until'] || '')) || String(b['Registration Date'] || '').localeCompare(String(a['Registration Date'] || ''));

function histItem(x, isNow) {
  const p = IX.pd[x['Entry ID']], c = IX.cd[x['Entry ID']];
  const pos = IX.pos[x['Position Title']], sg = pos ? pos['Salary Grade'] : '';
  const off = IX.off[x['Office Code']];
  const detail = [];
  if (x['Appointment Status']) detail.push(x['Appointment Status']);
  if (p) detail.push('Item ' + p['Item Number'] + (sg !== '' ? ' · SG ' + sg + '-' + p['Salary Step'] : ''));
  if (c) detail.push(peso(c['Daily Rate (PHP)']) + '/day' + (c['Nature of Work'] ? ' · ' + c['Nature of Work'] : ''));
  const sp = IX.sepd[x['Entry ID']];
  if (sp && sp['Cause']) detail.unshift(sp['Cause'] + (sp['Notes'] ? ' · ' + sp['Notes'] : ''));
  const tools = PENDING_ENTRIES.has(x['Entry ID']) ? '<span class="pill saving" style="margin-left:auto">Saving…</span>' : canEdit() ? `<span class="evTools"><button class="iconBtn" data-act="editEntry" data-entry="${esc(x['Entry ID'])}" aria-label="Edit entry ${esc(x['Entry ID'])}" title="Edit (master password)">${ICON.pen}</button><button class="iconBtn del" data-act="deleteEntry" data-entry="${esc(x['Entry ID'])}" aria-label="Delete entry ${esc(x['Entry ID'])}" title="Delete (master password)">${ICON.trash}</button></span>` : '';
  return `<div class="ev${isNow ? ' now' : ''}"><div class="when">${esc(x['Effective Date'] ? fmtDate(x['Effective Date']) : 'no date')}</div><div class="dot"></div>
    <div class="what"><div class="head"><b>${esc(x['Change Type'] || 'Entry')}</b>${isNow ? '<span class="pill filled">Current</span>' : ''}<span class="tag">${esc(x['Entry ID'])}</span>${tools}</div>
      ${x['Position Title'] || off || x['Change Type'] !== 'Separation' ? `<span>${esc(x['Position Title'] || '—')}${off ? ' · ' + esc(offLetterName(x['Office Code'])) : ''}</span>` : ''}
      ${detail.length ? `<span class="sub">${esc(detail.join(' · '))}</span>` : ''}
      ${orderLine(x)}

}

/* ═══════════════════════ seats ═══════════════════════ */
function filteredSeats() {
  return D.seats.filter(s => {
    const held = !!IX.holder[s['Item Number']];
    if (S.seatFilter === 'vacant' && held) return false;
    if (S.seatFilter === 'filled' && !held) return false;
    if (!inOffice(s['Office Code'], S.seatOffice)) return false;
    return (S.filters.seats || []).every(f => passFilter('seats', s, f));
  });
}

    </tbody></table></div>`;

/* Drawn from the Offices tree and where each person works today. The head of a division or section is the person
   designated OIC there, else the highest-graded plantilla employee assigned straight to that office. Units list everyone:

const orgName = e => (e['First Name'] + (e['Middle Name'] ? ' ' + e['Middle Name'][0] + '.' : '') + ' ' + e['Last Name'] + (e['Suffix'] ? ' ' + e['Suffix'] : '')).toUpperCase();

  const out = new Uint8Array(len); let p = 0; parts.forEach(b => { out.set(b, p); p += b.length; });
  return out;
}

/* ═══════════════════════ attach a scanned order ═══════════════════════ */
const ORDER_TYPES = ['application/pdf', 'image/jpeg', 'image/png'];
function filePick(id) {
  return `<div class="filePick" id="${id}_box">
    <input type="file" id="${id}" accept="application/pdf,image/jpeg,image/png" hidden>
    <label class="btn small" for="${id}">${ICON.clip} Choose a file…</label>
    <span class="fileName muted" id="${id}_name">No file chosen</span>
    <button type="button" class="iconBtn del" id="${id}_clear" aria-label="Remove the chosen file" hidden>${ICON.trash}</button>
    <span class="err" id="${id}_err" hidden></span></div>`;
}
function wireFilePick(id) {
  const f = $('#' + id); if (!f) return;
  const name = $('#' + id + '_name'), clr = $('#' + id + '_clear'), err = $('#' + id + '_err');
  const reset = () => { f.value = ''; name.textContent = 'No file chosen'; clr.hidden = true; };
  const refuse = msg => { reset(); err.textContent = msg; err.hidden = false; };
  f.addEventListener('change', () => {
    const file = f.files[0];
    if (!file) { err.hidden = true; return reset(); }
    if (ORDER_TYPES.indexOf(file.type) < 0) return refuse('Only PDF, JPG or PNG. That one is a ' + (file.type || 'kind we don\'t know') + '.');
    if (file.size > 10 * 1024 * 1024) return refuse('That file is bigger than 10 MB. Scan it at a lower quality.');
    err.hidden = true; name.textContent = file.name + ' · ' + Math.max(1, Math.round(file.size / 1024)) + ' KB'; clr.hidden = false;
  });
  if (clr) clr.addEventListener('click', () => { err.hidden = true; reset(); });
}
/* Reads the chosen file as base64, ready for the server. Returns null when nothing was picked. */
function readFilePick(id) {
  const f = $('#' + id); const file = f && f.files[0];
  if (!file) return Promise.resolve(null);
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve({ name: file.name, mimeType: file.type, bytes: String(r.result).split(',')[1] || '' });
    r.onerror = () => reject(new Error('That file could not be read. Try choosing it again.'));
    r.readAsDataURL(file);
  });
}
const hasFile = id => { const f = $('#' + id); return !!(f && f.files && f.files[0]); };
/* Sends the scan to the entry the save just created. Returns a note for the toast when it fails. */
function afterOrderFile(pickId) {
  return async res => {
    const file = await readFilePick(pickId);
    if (!file) return '';
    const entry = (IX.hist[res.id] || [])[0];
    if (!entry) return ' — but there was no entry to attach the scan to';
    const r = await callRetry('saveOrderFile', Object.assign({ entryId: entry['Entry ID'] }, file));
    load(r.data); saveCache();
    return '';
  };
}
/* After a job change is saved, send the scan along to the entry it belongs to */
async function attachOrder(pickId, entryId) {
  const file = await readFilePick(pickId);
  if (!file || !entryId) return;
  try { const res = await callRetry('saveOrderFile', Object.assign({ entryId: entryId }, file)); load(res.data); saveCache(); render(); toast('Scanned order attached'); }
  catch (e) { toast('Saved, but the scan did not upload: ' + e.message, 'err', 6000); }
}

/* A box you type into instead of a dropdown holding every name. The chosen
   Employee Number sits in a hidden input with the id you asked for, so code
   that read the old select keeps working. */
function empPicker(id, picked) {
  const e = picked ? IX.emp[picked] : null;
  return `<div class="pick" id="${id}_pick">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="text" id="${id}_q" class="pickQ" autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list"
      placeholder="Type a name or employee number" value="${e ? esc(fullName(e) + ' — ' + picked) : ''}">
    <input type="hidden" id="${id}" value="${esc(picked || '')}">
    <button type="button" class="pickX" aria-label="Clear" ${e ? '' : 'hidden'}>×</button>
    <div class="sugg pickList" id="${id}_list" hidden></div></div>`;
}
function wireEmpPicker(id, onPick) {
  const q = $('#' + id + '_q'), hid = $('#' + id), list = $('#' + id + '_list'), clr = $('#' + id + '_pick .pickX');
  if (!q) return;
  let at = -1, rows = [];
  const label = e => fullName(e) + ' — ' + e['Employee Number'];
  const close = () => { list.hidden = true; q.setAttribute('aria-expanded', 'false'); at = -1; };
  const draw = () => {
    const typed = q.value.trim().toLowerCase();
    const chosen = hid.value && typed === label(IX.emp[hid.value] || {}).toLowerCase();
    rows = (chosen ? D.employees : D.employees.filter(e => empMatch(e, typed))).slice(0, 40);
    if (!rows.length) { list.innerHTML = '<p class="empty" style="padding:10px 12px">Nobody matches that.</p>'; list.hidden = false; return; }
    list.innerHTML = rows.map((e, i) => { const c = IX.cur[e['Employee Number']] || {};
      return `<div class="sgr${i === at ? ' on' : ''}"><button type="button" class="sgi" data-pi="${i}">${avatar(e)}<span>${esc(fullName(e))} <em>${esc(e['Employee Number'])}</em><em style="display:block;margin:0">${esc(c.position || '')}${c.officeCode ? ' · ' + esc(c.officeCode) : ''}</em></span></button></div>`;
    }).join('');
    list.hidden = false; q.setAttribute('aria-expanded', 'true');
  };
  const pick = i => {
    const e = rows[i]; if (!e) return;
    hid.value = e['Employee Number']; q.value = label(e); clr.hidden = false;
    close(); if (onPick) onPick(hid.value);
  };
  q.addEventListener('focus', draw);
  q.addEventListener('input', () => { hid.value = ''; clr.hidden = !q.value; draw(); if (onPick) onPick(''); });
  q.addEventListener('blur', () => setTimeout(close, 140));
  q.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') { close(); return; }
    if (list.hidden && (ev.key === 'ArrowDown' || ev.key === 'ArrowUp')) { draw(); return; }
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
      ev.preventDefault();
      at = (at + (ev.key === 'ArrowDown' ? 1 : -1) + rows.length) % rows.length;
      Array.from(list.querySelectorAll('.sgr')).forEach((r, i) => r.classList.toggle('on', i === at));
      const on = list.querySelector('.sgr.on'); if (on) on.scrollIntoView({ block: 'nearest' });
    } else if (ev.key === 'Enter') { ev.preventDefault(); pick(at >= 0 ? at : 0); }
  });
  list.addEventListener('mousedown', ev => { ev.preventDefault(); const b = ev.target.closest('[data-pi]'); if (b) pick(Number(b.dataset.pi)); });

function wireJob() {

function loadImg(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => resolve(img); img.onerror = () => reject(new Error('That file isn\'t a picture we can read. Try a JPG or PNG.')); img.src = r.result; };
    r.onerror = () => reject(new Error('Couldn\'t read that file.'));
    r.readAsDataURL(file);
  });
}

/* Who turns the retirement age in the next five years, split into plantilla and CoS / JO */

/* ═══════════════════════ certificate of employment ═══════════════════════ */
/* A letter, not a table: Tahoma 11 throughout, ready to print and sign.
   Word and the browser both have Tahoma, so the page, the .doc file and the
   printed PDF all come out looking the same. */
const COE_PURPOSES = ['whatever legal purpose it may serve', 'loan application', 'bank requirement',
  'visa application', 'scholarship application', 'Pag-IBIG requirement', 'GSIS requirement', 'PhilHealth requirement'];

/* "DELA CRUZ" → "Dela Cruz", for sentences inside a certificate */
const titleCase = v => sv(v).toLowerCase().replace(/(^|[\s'-])([a-z])/g, (m, a, b) => a + b.toUpperCase());
/* For a letter: most specific first, e.g. "Plant and Ports Section, Floating Equipment Division" */
const offLetterName = code => { const p = (IX.offPath || {})[String(code)]; return p && p.length ? p.slice().reverse().map(o => o['Office Name']).join(', ') : offName(code); };
const ordinal = n => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : { 1: 'st', 2: 'nd', 3: 'rd' }[n % 10] || 'th');
const MONTHS_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const longDate = s => { const d = toDate(s); return MONTHS_LONG[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear(); };

function coeFacts(id) {
  const e = IX.emp[id], c = IX.cur[id];
  const he = e['Sex'] === 'F' ? 'She' : e['Sex'] === 'M' ? 'He' : 'He/She';
  const his = e['Sex'] === 'F' ? 'her' : e['Sex'] === 'M' ? 'his' : 'his/her';
  const title = e['Sex'] === 'F' ? 'MS.' : e['Sex'] === 'M' ? 'MR.' : 'MR./MS.';
  // After a separation the newest entry is the separation itself, so read the last real job
  const past = c.separated ? (IX.hist[id] || []).filter(h => h['Change Type'] !== 'Separation')[0] || null : null;
  const pastPd = past ? IX.pd[past['Entry ID']] : null, pastCd = past ? IX.cd[past['Entry ID']] : null;
  const plantilla = c.separated ? !!pastPd : c.kind === 'plantilla';
  const position = c.separated ? (past ? past['Position Title'] : '') : c.position;
  const officeCode = c.separated ? (past ? past['Office Code'] : '') : c.officeCode;
  const statusText = c.separated ? sv(past && past['Appointment Status']) : (plantilla ? sv(c.status) || 'Permanent' : 'Contract of Service / Job Order');
  const status = /contract|job order/i.test(statusText) ? 'Contract of Service / Job Order' : (statusText || 'Permanent').toLowerCase();
  const monthly = c.separated
    ? (pastPd && IX.pos[position] ? (rateFor('Monthly', IX.pos[position]['Salary Grade'], pastPd['Salary Step'], yearOf(past['Effective Date'])) || {}).rate : '')
    : c.monthly;
  const daily = c.separated ? (pastCd ? pastCd['Daily Rate (PHP)'] : '') : c.daily;
  const days = Number((D.amounts || {}).contractDays || 22);
  // Everything on a certificate is yearly: a month times twelve, or a daily rate times 22 days times twelve
  const round2 = n => Math.round(n * 100) / 100;
  const annual = plantilla
    ? (monthly === '' || monthly === undefined || monthly === null ? '' : round2(Number(monthly) * 12))
    : (daily === '' || daily === undefined || daily === null ? '' : round2(Number(daily) * days * 12));
  const permanent = plantilla && /^permanent$/i.test(sv(statusText) || 'Permanent');
  const technical = /^technical$/i.test(plantilla
    ? sv((IX.pos[position] || {})['Technical / Non-Technical'])
    : sv(c.separated ? (pastCd || {})['Technical / Non-Technical'] : c.tech));
  return {
    e: e, c: c, he: he, his: his, title: title, plantilla: plantilla, status: status,
    monthly: monthly, daily: daily, annual: annual, days: days, permanent: permanent, technical: technical,
    sg: c.separated ? (pastPd && IX.pos[position] ? IX.pos[position]['Salary Grade'] : '') : c.sg,
    step: c.separated ? (pastPd ? pastPd['Salary Step'] : '') : c.step,
    name: [e['First Name'], e['Middle Name'], e['Last Name']].filter(Boolean).join(' ') + (e['Suffix'] ? ' ' + e['Suffix'] : ''),
    office: officeCode ? offLetterName(officeCode) : '',
    position: position || '', start: c.start, until: c.separated ? (c.since || '') : ''
  };
}

/* One source of truth for the certificate's content: used by the HTML preview, the Word file and the PDF. */
function coeBody(id, o) {
  o = o || {};
  const f = coeFacts(id);
  const issued = o.date || D.today;
  const d = toDate(issued);
  const coe = D.coe || {};
  const purpose = sv(o.purpose) || COE_PURPOSES[0];
  const period = f.start
    ? 'from ' + longDate(f.start) + ' ' + (f.until ? 'to ' + longDate(f.until) : 'up to the present')
    : (f.until ? 'until ' + longDate(f.until) : '');
  const body = [];
  body.push('This is to certify that <b>' + esc(f.title) + ' ' + esc(f.name.toUpperCase()) + '</b> ' + (f.c.separated ? 'was' : 'is') +
    ' a <b>' + esc(f.status) + '</b> employee of the ' + esc(D.department || 'Department of Public Works and Highways') +
    ' &ndash; ' + esc(D.agency || 'Bureau of Equipment') +
    (f.position ? ', ' + (f.c.separated ? 'who last held' : 'holding') + ' the position of <b>' + esc(f.position) + '</b>' : '') +
    (f.office ? ', assigned at the ' + esc(f.office) : '') + (period ? ', ' + esc(period) : '') + '.');
  if (o.pay && f.annual !== '') body.push(esc(f.he) + ' ' + (f.c.separated ? 'received' : 'is currently receiving') +
    ' an annual salary of <b>' + esc(peso(f.annual)) + '</b>' +
    (f.plantilla
      ? (f.sg !== '' ? ' (Salary Grade ' + esc(f.sg) + (f.step !== '' ? '-' + esc(f.step) : '') + ', ' + esc(peso(f.monthly)) + ' a month)' : ' (' + esc(peso(f.monthly)) + ' a month)')
      : ', based on a daily rate of ' + esc(peso(f.daily)) + ' for ' + f.days + ' days a month') + '.');
  if (o.conduct) body.push('This further certifies that ' + esc(f.he.toLowerCase()) + ' has no derogatory record on file with this Bureau.');
  const asked = f.title === 'MS.' ? 'Ms. ' + titleCase(f.e['Last Name']) : f.title === 'MR.' ? 'Mr. ' + titleCase(f.e['Last Name']) : 'the above-named employee';
  body.push('This certification is issued upon the request of ' + esc(asked) + ' for <b>' + esc(purpose) + '</b>.');
  body.push('Issued this ' + ordinal(d.getDate()) + ' day of ' + MONTHS_LONG[d.getMonth()] + ' ' + d.getFullYear() +
    (sv(coe.place) ? ' at ' + esc(sv(coe.place)) : '') + '.');
  const salary = o.pay && o.breakdown && f.permanent && f.monthly !== '' ? coeLines(f) : null;
  return { f: f, issued: issued, body: body, salary: salary,
    sign: { label: 'Signed By', name: (sv(coe.signatory) || 'LEONISA M. DELA CRUZ'), title: (sv(coe.title) || 'Administrative Officer IV') } };
}

/* The letter as HTML, used by the preview, the Word file and printing. */
function docCOE(id, o) {
  const b = coeBody(id, o);
  return `<div class="coe">

    ${b.salary ? `<table class="coeTable">${b.salary.rows.map(r => `<tr><td>${esc(r[0])}</td><td class="coeAmt" align="right">${esc(peso(r[1]))}</td></tr>`).join('')}
      <tr class="coeTotal"><td><b>TOTAL</b></td><td class="coeAmt" align="right"><b>${esc(peso(b.salary.total))}</b></td></tr></table>` : ''}
    <div class="coeSign"><div class="coeSignLabel">${esc(b.sign.label)}</div>
      <div class="coeSignName"><b>${esc(b.sign.name)}</b></div>

}

/* The same letter as a real, downloadable A4 PDF, drawn by the app's own PDF engine (works offline). */
function coePdf(id, o) {
  const b = coeBody(id, o), size = 11, blocks = [];
  blocks.push({ t: 'ltext', runs: [{ s: 'TO WHOM IT MAY CONCERN:', bold: false }], indent: 0, size: size, gap: 12, just: false });
  b.body.forEach(p => blocks.push({ t: 'ltext', runs: coeRuns(p), indent: 36, size: size, gap: 11 }));
  if (b.salary) {
    blocks.push({ t: 'lgap', h: 6 });
    b.salary.rows.forEach(r => blocks.push({ t: 'lkv', label: r[0], amount: peso(r[1]), size: size, h: size * 1.35 }));
    blocks.push({ t: 'ltot', label: 'TOTAL', amount: peso(b.salary.total), size: size, h: size * 1.35 + 10 });
  }
  blocks.push({ t: 'lgap', h: 34 });
  blocks.push({ t: 'lsign', label: b.sign.label, name: b.sign.name, title: b.sign.title, size: size, h: 60 });
  return buildPdf({ title: 'CERTIFICATE OF EMPLOYMENT', columns: [], body: blocks });
}

/* What a regular employee receives in a year, on top of the basic salary.
   Every amount comes from Settings, so a rate change needs no new code. */
function coeLines(f) {
  const A = D.amounts || {};
  const m = Number(f.monthly) || 0;
  const n = (k, d) => { const v = Number(A[k]); return isNaN(v) ? d : v; };
  const rows = [
    ['Basic salary (' + peso(m) + ' x 12)', Number(f.annual) || 0],
    [(n('months1314', 2) === 2 ? '13th and 14th month pay' : n('months1314', 2) + ' months\u2019 pay') + ' (' + peso(m) + ' x ' + n('months1314', 2) + ')', m * n('months1314', 2)],
    ['PERA Allowance', n('pera', 24000)],
    ['Year-End Bonus and Cash Gift (' + peso(m) + ' + ' + peso(n('cashGift', 5000)) + ')', m * n('yearEndMonths', 1) + n('cashGift', 5000)],
    ['Clothing Allowance', n('clothing', 6000)],
    ['CNA', n('cna', 25000)]
  ];
  if (f.technical) rows.push(['Field Allowance and Hazard Pay', n('fieldHazard', 118800)]);
  return { rows: rows.map(r => [r[0], Math.round(r[1] * 100) / 100]), total: Math.round(rows.reduce((t, r) => t + r[1], 0) * 100) / 100 };
}

/* Pack a web page and its pictures into one file Word opens (MHTML). */
function mhtDoc(html, parts) {
  const B = '----=_NextPart_BOE_EDMS_000', root = 'file:///C:/BOE/', nl = '\r\n';
  const b64 = bytes => { let t = ''; for (let i = 0; i < bytes.length; i += 0x8000) t += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(t).replace(/(.{76})/g, '$1' + nl); };
  const qp = text => {                 // quoted-printable, the way Word itself saves the page part
    const out = []; let line = '';
    const put = tok => { if (line.length + tok.length > 75) { out.push(line + '='); line = ''; } line += tok; };
    new TextEncoder().encode(text).forEach(c => { if (c === 10) { out.push(line); line = ''; } else if (c === 13) { /* dropped; lines end with CRLF below */ } else put((c === 61 || c < 32 || c > 126) ? '=' + (c < 16 ? '0' : '') + c.toString(16).toUpperCase() : String.fromCharCode(c)); });
    out.push(line); return out.map(l => l.replace(/ $/, '=20')).join(nl);
  };
  let m = 'MIME-Version: 1.0' + nl + 'Content-Type: multipart/related; boundary="' + B + '"; type="text/html"' + nl + nl + 'This document is a Single File Web Page, also known as a Web Archive file.' + nl + nl;
  m += '--' + B + nl + 'Content-Location: ' + root + 'certificate.htm' + nl + 'Content-Transfer-Encoding: quoted-printable' + nl + 'Content-Type: text/html; charset="utf-8"' + nl + nl + qp(html) + nl + nl;
  parts.forEach(p => { m += '--' + B + nl + 'Content-Location: ' + root + p.name + nl + 'Content-Transfer-Encoding: base64' + nl + 'Content-Type: ' + p.type + nl + nl + b64(p.bytes) + nl + nl; });
  return m + '--' + B + '--' + nl;
}

let pendingLogo, pendingLogo2;
function wireAdmin() {
  pendingLogo = undefined; pendingLogo2 = undefined;
  const slot = (inputId, prevId, label, set) => {
    const f = $('#' + inputId); if (!f) return;
    f.addEventListener('change', async ev => {
      const file = ev.target.files[0]; if (!file) return;
      try {
        const img = await loadImg(file);
        const h = Math.min(180, img.height), w = Math.round(img.width * h / img.height);
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h; cv.getContext('2d').drawImage(img, 0, 0, w, h);
        let d = cv.toDataURL('image/png');
        if (d.length > 45000) { const g = cv.getContext('2d'); g.globalCompositeOperation = 'destination-over'; g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); d = cv.toDataURL('image/jpeg', 0.85); }
        if (d.length > 45000) throw new Error('That logo is too detailed to store. Try a simpler or smaller file.');
        set(d); $('#' + prevId).innerHTML = '<img src="' + d + '" alt="' + label + '">';
        toast(label + ' ready. Click Save branding.');
      } catch (err) { toast(err.message); }
    });
  };
  slot('logoFile', 'logoPrev', 'Logo', d => { pendingLogo = d; });
  slot('logo2File', 'logo2Prev', 'Second logo', d => { pendingLogo2 = d; });
}
async function adminCall(fn, payload, done, btn) {
  if (LOCAL[fn]) {
    try { queueSave(fn, payload); } catch (e) { return toast(e.message, 'err'); }
    toast(done); return render();
  }
  if (btn) { btn.disabled = true; }
  try { await drain(); const res = await callRetry(fn, payload); load(res.data); saveCache(); toast(done); render(); }
  catch (e) { toast(e.message, 'err'); if (btn) btn.disabled = false; }
}

/* Manila time, e.g. "Oct 13, 2026 · 8:18 PM GMT+8" */
function manilaNow() {
  const d = new Date(), o = { timeZone: 'Asia/Manila' };
  let date, time, hour;
  try {
    date = d.toLocaleDateString('en-US', Object.assign({ month: 'short', day: 'numeric', year: 'numeric' }, o));
    time = d.toLocaleTimeString('en-US', Object.assign({ hour: 'numeric', minute: '2-digit' }, o));
    hour = Number(d.toLocaleString('en-US', Object.assign({ hour: 'numeric', hourCycle: 'h23' }, o)));
  } catch (e) { date = fmtDate(iso(d)); time = d.toLocaleTimeString(); hour = d.getHours(); }
  return { text: date + ' · ' + time + ' GMT+8', hour: hour };
}

/* ═══════════════════════ search history ═══════════════════════ */
const HIST_KEY = () => 'boe-search-history-v1:' + (window.__ME || 'anon');
let HIST = null;
function hist() {
  if (HIST) return HIST;
  try { HIST = JSON.parse(localStorage.getItem(HIST_KEY()) || 'null'); } catch (e) { HIST = null; }
  if (!HIST || !Array.isArray(HIST.q) || !Array.isArray(HIST.p)) HIST = { q: [], p: [] };
  return HIST;
}
function histSave() { try { localStorage.setItem(HIST_KEY(), JSON.stringify(HIST)); } catch (e) { /* this browser blocks storage: history lasts until reload */ } }
function rememberSearch(q) {
  q = String(q || '').trim(); if (q.length < 2) return;
  const h = hist(); h.q = [q].concat(h.q.filter(x => x.toLowerCase() !== q.toLowerCase())).slice(0, 8); histSave();
}
function rememberProfile(id) { if (!id) return; const h = hist(); h.p = [id].concat(h.p.filter(x => x !== id)).slice(0, 6); histSave(); }
let SUGG_I = -1;
function showSugg() {
  const box = $('#sugg'); if (!box || !D) return;
  const typed = $('#q').value.trim().toLowerCase(), h = hist();
  const qs = h.q.filter(x => !typed || x.toLowerCase().includes(typed));
  const ps = h.p.filter(id => IX.emp[id] && (!typed || fullName(IX.emp[id]).toLowerCase().includes(typed)));
  if (!qs.length && !ps.length) { box.hidden = true; return; }

/* ═══════════════════════ photo crop ═══════════════════════ */
const VIEW = 280;
function cropGeom(st) {
  const turned = st.rot % 180 !== 0, iw = turned ? st.img.height : st.img.width, ih = turned ? st.img.width : st.img.height;
  const sc = VIEW / Math.min(iw, ih) * st.zoom;
  return { sc: sc, maxX: Math.max(0, (iw * sc - VIEW) / 2), maxY: Math.max(0, (ih * sc - VIEW) / 2) };
}
function cropClamp(st) { const g = cropGeom(st); st.ox = Math.max(-g.maxX, Math.min(g.maxX, st.ox)); st.oy = Math.max(-g.maxY, Math.min(g.maxY, st.oy)); }
function cropDraw(st, ctx, size) {
  const k = size / VIEW, g = cropGeom(st);
  ctx.save(); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, size, size);
  ctx.translate(size / 2 + st.ox * k, size / 2 + st.oy * k); ctx.rotate(st.rot * Math.PI / 180); ctx.scale(g.sc * k, g.sc * k);
  ctx.imageSmoothingQuality = 'high'; ctx.drawImage(st.img, -st.img.width / 2, -st.img.height / 2); ctx.restore();
}
function cropJpeg(st, size, maxLen) {
  for (let px = size; px >= 96; px -= 40) {
    const cv = document.createElement('canvas'); cv.width = cv.height = px; cropDraw(st, cv.getContext('2d'), px);
    for (let q = 0.88; q >= 0.5; q -= 0.08) { const d = cv.toDataURL('image/jpeg', q); if (d.length <= maxLen) return d; }
  }
  throw new Error('That picture is too detailed to store. Try a smaller photo.');
}

/* ═══════════════════════ calendar picker ═══════════════════════ */
/* Every date field is a read-only text box that shows "Oct 14, 2026" and keeps the
   real value in data-iso (yyyy-MM-dd). Reading code goes through dv() below, so the
   rest of the app still sees plain yyyy-MM-dd dates. */
const dv = x => {
  const el = typeof x === 'string' ? $('#' + x) : x;
  if (!el) return '';
  return el.dataset && el.dataset.iso !== undefined ? el.dataset.iso : String(el.value).trim();
};
const CAL = (function () {
  const MONL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const WEEK = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const DOW = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  const MON3 = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const pad2 = n => (n<10?'0':'')+n;
  const isoL = d => d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
  const dispL = s => { const p=String(s).split('-').map(Number); return MON3[p[1]-1]+' '+p[2]+', '+p[0]; };
  // write ISO to data-iso always; use the host app's own display formatter when present
  const toISO = d => (typeof isoDate==='function')?isoDate(d):((typeof iso==='function')?iso(d):isoL(d));
  const toDisp = s => (typeof showDate==='function')?showDate(s):((typeof fmtDate==='function')?fmtDate(s):dispL(s));
  const addD = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
  const same = (a,b) => !!(a && b && a.getTime()===b.getTime());
  const parse = s => { const m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(String(s||'').trim()); return m?new Date(Number(m[1]),Number(m[2])-1,Number(m[3])):null; };
  const midnight = () => { const t=new Date(); t.setHours(0,0,0,0); return t; };
  const clampDay = (y,m,day) => Math.min(day, new Date(y,m+1,0).getDate());
  const isPhone = () => window.matchMedia('(max-width:560px)').matches;

  let box=null, field=null, lo=null, hi=null, picked=null, vy=2000, vm=0, step='year', cells=[];
  const isOpen = () => !!box && box.classList.contains('show');
  const barred = d => !!d && ((lo && d<lo) || (hi && d>hi));
  // a month has at least one selectable day?
  const monthOpen = (y,m) => { const first=new Date(y,m,1), last=new Date(y,m+1,0); return !((hi && first>hi) || (lo && last<lo)); };
  const yearOpen = y => { const first=new Date(y,0,1), last=new Date(y,11,31); return !((hi && first>hi) || (lo && last<lo)); };

  function build() {
    if (box) return;
    box = document.createElement('div');
    box.className='cal'; box.tabIndex=-1;
    box.setAttribute('role','dialog'); box.setAttribute('aria-label','Choose a date');
    box.innerHTML =
      '<div class="cal-head"><small id="cHd">Choose a date</small><div class="cal-pk empty" id="cPk">—</div></div>' +
      '<div class="cal-steps" id="cSteps">' +
        '<button type="button" data-step="year">Year<span class="v" id="cvY">—</span></button>' +
        '<button type="button" data-step="month">Month<span class="v" id="cvM">—</span></button>' +
        '<button type="button" data-step="day">Day<span class="v" id="cvD">—</span></button>' +
      '</div>' +
      '<div class="cal-body">' +
        '<div class="cal-sect" data-p="year"><h4>Year</h4><div class="cal-box"><div class="cal-yg" id="cYG"></div></div></div>' +
        '<div class="cal-sect" data-p="month"><h4>Month</h4><div class="cal-box"><div class="cal-mg" id="cMG"></div></div></div>' +
        '<div class="cal-sect" data-p="day"><h4 id="cDT">Day</h4><div class="cal-dbox"><div class="cal-dow" id="cDOW"></div><div class="cal-dg" id="cDG"></div></div></div>' +
      '</div>' +
      '<div class="cal-foot"><button type="button" data-cact="today">Today</button><button type="button" data-cact="clear">Clear</button></div>';
    document.body.appendChild(box);
    box.querySelector('#cDOW').innerHTML = DOW.map(d=>'<span>'+d+'</span>').join('');

    box.addEventListener('pointerdown', ev => { if (ev.target.closest('button')) ev.preventDefault(); });
    box.addEventListener('click', ev => {
      const st = ev.target.closest('[data-step]');
      if (st) { setStep(st.dataset.step); return; }
      const y = ev.target.closest('[data-y]');
      if (y) return onYear(Number(y.dataset.y));
      const m = ev.target.closest('[data-m]');
      if (m) return onMonth(Number(m.dataset.m));
      const d = ev.target.closest('[data-d]');
      if (d) return onDay(cells[Number(d.dataset.d)]);
      const act = ev.target.closest('[data-cact]');
      if (act) {
        if (act.dataset.cact==='clear') return pick(null);
        const t=midnight(); if (barred(t)) return;
        vy=t.getFullYear(); vm=t.getMonth(); pick(t);
      }
    });
    box.addEventListener('keydown', ev => { if (ev.key==='Escape'){ ev.stopPropagation(); close(); } });
    document.addEventListener('pointerdown', ev => { if (isOpen() && !ev.target.closest('.cal') && !ev.target.closest('[data-cal]')) close(); }, true);
    window.addEventListener('resize', place);
    window.addEventListener('scroll', place, true);
  }

  function onYear(y){ vy=y; if (picked) picked=new Date(y,vm,clampDay(y,vm,picked.getDate())); if (isPhone()) setStep('month'); else renderAll(); if(!isPhone()) {} }
  function onMonth(m){ vm=m; if (picked) picked=new Date(vy,m,clampDay(vy,m,picked.getDate())); if (isPhone()) setStep('day'); else renderAll(); }
  function onDay(d){ if (!d || barred(d)) return; pick(d); }

  function setStep(s){ step=s; box.classList.remove('step-year','step-month','step-day'); box.classList.add('step-'+s); renderAll(); }

  function renderYears(){
    const g=box.querySelector('#cYG'); let h='';
    const minY=lo?lo.getFullYear():1900, maxY=hi?hi.getFullYear():2100;
    const start=Math.floor(minY/10)*10, end=Math.ceil((maxY+1)/10)*10-1;
    for (let y=start;y<=end;y++){
      const hide=(y<minY||y>maxY), dis=!hide && !yearOpen(y);
      h+='<button type="button" class="cal-y'+(y===vy?' on':'')+(hide?' cal-yhide':'')+'" data-y="'+y+'"'+((hide||dis)?' disabled':'')+(hide?' tabindex="-1"':'')+'>'+y+'</button>';
    }
    g.innerHTML=h;
  }
  function renderMonths(){
    const g=box.querySelector('#cMG');
    g.innerHTML = MON3.map((name,m)=>'<button type="button" class="cal-m'+(m===vm?' on':'')+'" data-m="'+m+'"'+(monthOpen(vy,m)?'':' disabled')+'>'+name+'</button>').join('');
  }
  function renderDays(){
    box.querySelector('#cDT').textContent = MON3[vm].toUpperCase()+' '+vy;
    const g=box.querySelector('#cDG'); const today=midnight();
    const startDow=new Date(vy,vm,1).getDay(), gridStart=new Date(vy,vm,1-startDow);
    let h=''; cells=[];
    for (let i=0;i<42;i++){
      const d=new Date(gridStart.getFullYear(),gridStart.getMonth(),gridStart.getDate()+i);
      const out=d.getMonth()!==vm, off=barred(d);
      h+='<button type="button" class="cal-d'+(out?' out':'')+(same(d,today)&&!off?' today':'')+(same(d,picked)?' on':'')+'" data-d="'+i+'"'+(off?' disabled':'')+'>'+d.getDate()+'</button>';
      cells.push(d);
    }
    g.innerHTML=h;
  }
  function renderHead(){
    const hd=box.querySelector('#cHd'), pk=box.querySelector('#cPk');
    if (picked){ hd.textContent='Picked'; pk.className='cal-pk';
      pk.innerHTML='<span class="wd">'+WEEK[picked.getDay()]+', </span>'+MONL[picked.getMonth()]+' '+picked.getDate()+', '+picked.getFullYear();
    } else { hd.textContent='Choose a date'; pk.className='cal-pk empty'; pk.textContent='—'; }
    box.querySelector('#cvY').textContent=vy;
    box.querySelector('#cvM').textContent=MON3[vm];
    box.querySelector('#cvD').textContent=picked?picked.getDate():'—';
    box.querySelectorAll('.cal-steps button').forEach(b=>b.classList.toggle('on', b.dataset.step===step));
  }
  function renderAll(){ renderYears(); renderMonths(); renderDays(); renderHead();
    const tBtn=box.querySelector('[data-cact="today"]'); if (tBtn) tBtn.style.display = barred(midnight())?'none':''; place(); }

  function pick(d){
    if (barred(d)) return;
    picked=d;
    if (field){
      field.value = d?toDisp(toISO(d)):'';
      field.dataset.iso = d?toISO(d):'';
      field.dispatchEvent(new Event('change',{bubbles:true}));
    }
    if (d) close(); else renderAll();
  }
  function place(){
    if (!isOpen() || !field) return;
    const r=field.getBoundingClientRect(), w=box.offsetWidth, h=box.offsetHeight, vw=innerWidth, vh=innerHeight;
    let left=Math.max(8, Math.min(r.left, vw-w-8));
    let top=r.bottom+6;
    if (top+h>vh-8){ const up=r.top-h-6; top=up>=8?up:Math.max(8, vh-h-8); }
    box.style.left=Math.round(left)+'px'; box.style.top=Math.round(top)+'px';
  }
  function close(){
    if (box){ box.classList.remove('show'); }
    const f=field; field=null;
    if (f && document.contains(f)){ try{ f.focus({preventScroll:true}); }catch(e){ f.focus(); } }
  }
  function openOn(input){
    build();
    field=input;
    lo=parse(input.dataset.min); hi=parse(input.dataset.max);
    picked=parse(input.dataset.iso);
    let base = picked || midnight();
    if (barred(base)) base = lo && midnight()<lo ? lo : (hi || midnight());
    vy=base.getFullYear(); vm=base.getMonth();

    renderAll();

  }
  return {
    attach: function(input){
      build();
      input.addEventListener('pointerdown', ev => { ev.preventDefault(); if (field===input && isOpen()) return close(); openOn(input); });
      input.addEventListener('keydown', ev => { if (ev.key==='Enter'||ev.key===' '||ev.key==='ArrowDown'){ ev.preventDefault(); openOn(input); } });
    },
    close: function(){ if (isOpen()) close(); }
  };
})();
function wireDates(root) {
  (root || document).querySelectorAll('[data-cal]').forEach(el => {
    if (el.dataset.calOn) return;
    el.dataset.calOn = '1';
    CAL.attach(el);
  });
}

});
$('#q').addEventListener('focus', showSugg);
$('#q').addEventListener('blur', () => { setTimeout(hideSugg, 120); rememberSearch($('#q').value); });
$('#sugg').addEventListener('mousedown', ev => {
  ev.preventDefault();
  const t = ev.target.closest('button'); if (!t) return;
  const h = hist();
  if (t.dataset.sxq !== undefined) { h.q = h.q.filter(x => x !== t.dataset.sxq); histSave(); return showSugg(); }
  if (t.dataset.sxp !== undefined) { h.p = h.p.filter(x => x !== t.dataset.sxp); histSave(); return showSugg(); }
  if (t.dataset.sclear !== undefined) { h.q = []; h.p = []; histSave(); return hideSugg(); }
  if (t.dataset.sp) { hideSugg(); $('#q').blur(); return go('profile', t.dataset.sp); }
  if (t.dataset.sq !== undefined) runSearch(t.dataset.sq);
});
document.addEventListener('change', ev => {
  if (ev.target.id === 'officeSel') { S.office = ev.target.value; render(); }
  if (ev.target.id === 'seatOfficeSel') { S.seatOffice = ev.target.value; render(); }
});
let qTimer = null;
$('#qClear').addEventListener('click', () => {
  clearTimeout(qTimer); $('#q').value = ''; $('#qClear').hidden = true; S.q = '';
  if (S.view === 'employees') render();
  $('#q').focus();
});
$('#q').addEventListener('input', ev => {
  $('#qClear').hidden = !ev.target.value;
  clearTimeout(qTimer);
  showSugg();
  qTimer = setTimeout(() => { S.q = ev.target.value; if (S.view !== 'employees') { S.kind = 'all'; S.office = ''; S.fix = ''; go('employees'); } else render(); }, 160);
});

window.__appReady = true;
start();
</script>
</body>
