<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOE Employee Database</title>
<meta name="description" content="Bureau of Equipment, DPWH: employee records, service history and certificates.">
<meta name="theme-color" content="#F0F0F0">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<script src="config.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #F0F0F0; overflow: hidden; }
  body { font: 13px/1.5 Tahoma, "Segoe UI", Verdana, sans-serif; color: #1B1B1B; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; }
  #msg a { color: #3C7FB1; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: transparent; }
</style>
</head>
<body>
<div id="msg">Opening the BOE Employee Database…</div>
<script>
  /* Shows the Apps Script app inside this page, so the address stays boerecords.online.
     If the browser can't show it here (not signed in to Google yet, first-time permission,
     or a browser that blocks it such as Safari), it opens the app at its Google address instead. */
  (function () {
    var u = (window.EDMS_URL || '').trim();
    var msg = document.getElementById('msg');
    if (!/^https:\/\/script\.google\.com\/.+\/exec\/?$/.test(u)) {
      msg.innerHTML = 'The Employee Database link is not set yet.<br>Paste the Apps Script /exec link in <b>config.js</b>.';
      return;
    }
    var seen = false, gone = false;
    var full = function () { if (!seen && !gone) { gone = true; location.replace(u); } };
    addEventListener('message', function (e) {
      if (e.data && e.data.boe === 'edms' && /\.googleusercontent\.com$|^https:\/\/script\.google\.com$/.test(e.origin)) seen = true;
    });
    var f = document.createElement('iframe');
    f.title = 'BOE Employee Database';
    f.allow = 'clipboard-read; clipboard-write; fullscreen';
    f.addEventListener('load', function () { setTimeout(full, 2500); });   // loaded but no "hello" = it was refused
    f.src = u;
    document.body.appendChild(f);
    setTimeout(full, 20000);                                               // never loaded at all
  })();
</script>
</body>
</html>
